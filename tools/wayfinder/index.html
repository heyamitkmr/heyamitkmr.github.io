      <p class="tech-name">${tech.name}</p>
      ${o.because ? html`<p class="because">${o.because} This exercise is designed for that.</p>` : ''}
      <dl class="facts"><div><dt>In everyday language</dt><dd>${tech.everyday}</dd></div><div><dt>What it helps with</dt><dd>${tech.helps}</dd></div><div><dt>When to use it</dt><dd>${tech.when}</dd></div></dl>
      ${tech.caution ? html`<p class="caution">${tech.caution}</p>` : ''}
      <details class="example"><summary>See an example</summary><p><span>Before</span>${tech.example.before}</p><p><span>After</span>${tech.example.after}</p></details>
      <details class="example" ${raw(o.steps ? 'open' : '')}><summary>See all the steps</summary><ol class="tech-steps">${tech.steps.filter((x) => x.q).map((x) => html`<li>${x.q}<small>${x.why}</small></li>`)}<li>${tech.debrief}</li></ol></details>
      ${past ? html`<p class="fine">You did this ${ago(past.updatedAt)}. Its answers are in your Full Working Record.</p>` : ''}
      <div class="card-do">${running
        ? html`<a class="btn primary" href="#/t/${t.id}/x/${running.id}">Continue exercise</a>`
        : html`<button class="btn primary" data-do="start-tech" data-tech="${tech.id}" data-stage="${o.stage || ''}" data-because="${o.because || ''}">Try this</button>`}
        ${o.extra || ''}</div>
    </article>`;
  }

  function screenRoute(S, t, scr, stage) {
    const route = WF.ROUTES[scr.route];
    const rs = t.routes[stage] || {};
    const opt = route.options.find((o) => o.id === rs.opt);
    if (opt && opt.tech) {
      const techId = rs.tech || opt.tech;
      const tech = WF.TECHNIQUES[techId];
      const others = route.alternates.filter((x) => x !== techId);
      const extra = html`<button class="btn" data-do="route-other" data-stage="${stage}">Show me another approach</button>
        <button class="btn quiet" data-do="next">Skip this entirely</button>`;
      return html`${techCard(t, tech, { because: techId === opt.tech ? opt.because : '', stage, extra: others.length ? extra : html`<button class="btn quiet" data-do="next">Skip this entirely</button>` })}
        <p class="help"><button class="link" data-do="route-reset" data-stage="${stage}">Choose a different situation</button></p>`;
    }
    return html`<h1 class="q" id="q" tabindex="-1">${route.q}</h1>
      <p class="why">Pick the nearest one. Wayfinder may suggest a short exercise, and skipping it is always fine.</p>
      <div class="choices">${route.options.map((o) => html`<button class="choice" data-do="route" data-stage="${stage}" data-id="${o.id}">${o.label}</button>`)}</div>
      <p class="fine">Suggestions come only from what you pick here. Nothing you've written is analysed.</p>
      <div class="navrow">${M.prevScreen(scr.id) ? html`<a class="btn quiet" href="#/t/${t.id}/s/${M.prevScreen(scr.id)}">Back</a>` : ''}<button class="btn quiet" data-do="next">Skip for now</button></div>`;
  }

  function screenBreak(S, t, scr, stage) {
    const nxt = M.nextScreen(scr.id);
    const nextStage = WF.STAGES.find((s) => s.id === M.stageOfScreen(nxt));
    const cur = WF.STAGES.find((s) => s.id === stage);
    return html`<div class="pausept">
      <p class="eyebrow">${cur.name} ${M.stageState(t, stage) === 'done' ? 'done' : 'for now'}</p>
      <h1 class="q" id="q" tabindex="-1">This is a good place to stop, if you want to.</h1>
      <p class="why">Problems rarely resolve in one go, and a night's sleep often helps. Everything is saved. Next is <strong>${nextStage.name}</strong>: ${nextStage.q.toLowerCase()}</p>
      ${stageMark(t, stage)}
      <div class="navrow"><button class="btn quiet" data-do="pause">Take a break</button><button class="btn primary" data-do="next" data-primary>Carry on to ${nextStage.name}</button></div>
    </div>`;
  }

  function screenWants(S, t, scr, stage) {
    const kinds = Object.entries(WF.WANT_KINDS);
    return html`${head(scr, t)}
      <ul class="rows">${t.wants.map((w) => html`<li class="wrow">
        <input class="line" data-bind="wants/#${w.id}/text" value="${w.text}" aria-label="What you want" data-enter="add-want">
        <select data-bind="wants/#${w.id}/kind" aria-label="What kind of thing is this?">${kinds.map(([k, v]) => html`<option value="${k}" ${raw(k === w.kind ? 'selected' : '')}>${v}</option>`)}</select>
        <button class="iconbtn" data-do="del-item" data-list="wants" data-id="${w.id}" aria-label="Remove">×</button>
      </li>`)}</ul>
      <button class="btn small" data-do="add-want">Add something you want</button>
      ${helpLink(t, stage)}${navrow(t, scr, { label: 'Continue' })}`;
  }

  function screenIdeas(S, t, scr, stage) {
    const a = WF.ANGLES[S.angle % WF.ANGLES.length];
    const p = a.prompts[S.anglePrompt % a.prompts.length];
    const list = t.ideas;
    return html`${head(scr, t)}
      <form class="ideaform" data-submit="add-idea"><input class="line" id="idea-input" aria-label="Add an idea" placeholder="Add an idea and press Enter" data-autofocus autocomplete="off"><button class="btn" type="submit">Add</button></form>
      <div class="angle"><p class="fine">Stuck? Try a different angle: <strong>${a.name}</strong></p><p class="angle-q">${p}</p><button class="link" data-do="angle">Another angle</button></div>
      ${list.length ? html`<p class="count">${list.length} so far</p>` : ''}
      <ul class="rows ideas">${list.map((i) => html`<li class="irow">
        <input class="line" data-bind="ideas/#${i.id}/text" value="${i.text}" aria-label="Idea">
        <button class="iconbtn" data-do="del-item" data-list="ideas" data-id="${i.id}" aria-label="Remove">×</button>
      </li>`)}</ul>
      ${helpLink(t, stage)}${navrow(t, scr, { label: 'Continue' })}`;
  }

  function screenShortlist(S, t, scr) {
    const ideas = B.liveIdeas(t);
    if (!ideas.length) {
      return html`${head(scr, t)}<div class="empty"><p>There are no alternatives to look at yet.</p><a class="btn" href="#/t/${t.id}/s/x.ideas">Go to Explore</a></div>${navrow(t, scr, { label: 'Skip for now' })}`;
    }
    return html`${head(scr, t)}
      <ul class="rows">${ideas.map((i) => html`<li class="card idea">
        <p class="idea-t">${i.text}</p>
        ${radios(`m${i.id}`, `ideas/#${i.id}/mark`, [['promising', 'Promising'], ['open', 'Keep open'], ['dropped', 'Drop']], i.mark, { rerender: true, label: `What to do with: ${i.text}` })}
        ${i.mark === 'dropped' ? html`<input class="line sub" data-bind="ideas/#${i.id}/why" value="${i.why}" placeholder="Why drop it? (optional)" aria-label="Why drop it?">` : ''}
      </li>`)}</ul>
      ${navrow(t, scr, { label: 'Continue' })}`;
  }

  function screenCompare(S, t, scr) {
    const ideas = t.ideas.filter((i) => i.mark === 'promising' && M.has(i.text));
    if (!ideas.length) {
      return html`${head(scr, t)}<div class="empty"><p>Mark something as promising and it'll appear here. This comparison is optional.</p><a class="btn" href="#/t/${t.id}/s/l.shortlist">Back to your shortlist</a></div>${navrow(t, scr, { label: 'Skip for now' })}`;
    }
    return html`${head(scr, t)}
      <div class="compare">${ideas.map((i) => html`<article class="card idea"><h2>${i.text}</h2>
        ${WF.RATINGS.map((r) => html`<div class="rate"><p>${r.name}<span class="muted"> — ${r.q}</span></p>
        ${radios(`r${i.id}${r.id}`, `ideas/#${i.id}/rate/${r.id}`, r.scale.map((s, n) => [n, s]), (i.rate || {})[r.id] ?? '', { num: true, label: `${r.name} of ${i.text}` })}</div>`)}
      </article>`)}</div>
      ${navrow(t, scr, { label: 'Continue' })}`;
  }

  function screenOutcome(S, t, scr) {
    return html`${head(scr, t)}
      <div class="outcomes" role="radiogroup" aria-label="Where you've landed">${WF.OUTCOMES.map((o) => html`<label class="outcome"><input type="radio" name="outcome" value="${o.id}" data-bind="outcome" ${raw(t.outcome === o.id ? 'checked' : '')}><span><strong>${o.label}</strong><small>${o.note}</small></span></label>`)}</div>
      <label class="fieldlabel" for="dec">In your own words, what have you decided?</label>
      <textarea class="write" id="dec" data-bind="a/a.decision" rows="3">
${t.a['a.decision'] || ''}</textarea>
      ${navrow(t, scr, { label: 'Continue' })}`;
  }

  function actionCard(S, t, a) {
    const ty = WF.ACTION_TYPES[a.type];
    const f = (key, label, ph) => html`<label class="sub"><span>${label}</span><input class="line" data-bind="actions/#${a.id}/${key}" value="${a[key]}" placeholder="${ph || ''}"></label>`;
    if (a.state !== 'open') {
      return html`<li class="card action closed"><p class="eyebrow">${ty.label} · ${B.actionState(a)}</p><p class="idea-t">${a.text}</p>${a.result ? html`<p class="muted">${a.result}</p>` : ''}</li>`;
    }
    return html`<li class="card action">
      <div class="seg" role="radiogroup" aria-label="Type of action">${Object.entries(WF.ACTION_TYPES).map(([k, v]) => html`<label title="${v.sub}"><input type="radio" name="ty${a.id}" value="${k}" data-bind="actions/#${a.id}/type" data-rerender ${raw(k === a.type ? 'checked' : '')}><span>${v.label}</span></label>`)}</div>
      <label class="sub"><span>${ty.main}</span><textarea class="line" rows="2" data-bind="actions/#${a.id}/text" data-action-text>
${a.text}</textarea></label>
      ${f('done', ty.done)}
      <details class="more" data-keep="${a.id}" ${raw(S.openDetails[a.id] ? 'open' : '')}><summary>Add detail</summary>
        ${f('first', 'First step', 'The smallest starting action')}
        ${f('trigger', 'Trigger', 'What will prompt you?')}
        <label class="sub"><span>When <span class="muted">(optional)</span></span><input class="line" type="date" data-bind="actions/#${a.id}/when" value="${a.when}"></label>
        ${f('obstacle', 'Likely obstacle', 'What might stop you?')}
        ${f('fallback', 'Fallback', 'What will you do if that happens?')}
        ${f('evidence', ty.evidence)}
      </details>
      <div class="card-foot"><button class="link" data-do="checkin-open" data-id="${a.id}">Check in</button><button class="link danger" data-do="del-item" data-list="actions" data-id="${a.id}">Remove</button></div>
      ${S.checkinOpen === a.id ? checkin(S, t, a) : ''}
    </li>`;
  }

  function checkin(S, t, a) {
    const pick = S.checkin[a.id];
    return html`<div class="checkin">
      <div class="chips" role="group" aria-label="How did it go?">${Object.entries(WF.CHECKIN).map(([k, v]) => html`<button class="chip-btn ${pick === k ? 'on' : ''}" aria-pressed="${pick === k ? 'true' : 'false'}" data-do="checkin-pick" data-id="${a.id}" data-state="${k}">${v.label}</button>`)}</div>
      ${pick ? html`<label class="sub"><span>${WF.CHECKIN[pick].q}</span><textarea class="line" rows="2" id="ci-${a.id}"></textarea></label><button class="btn small" data-do="checkin-save" data-id="${a.id}">Save</button>` : ''}
    </div>`;
  }

  function whatNow(t) {
    return html`<aside class="card whatnow"><h2>Everything's checked in. What now?</h2>
      <div class="card-do"><a class="btn" href="#/t/${t.id}/s/a.actions">Plan the next step</a><a class="btn quiet" href="#/t/${t.id}/s/d.sum">Rethink from the start</a><button class="btn quiet" data-do="set-status" data-status="resolved">Mark as resolved</button><button class="btn quiet" data-do="set-status" data-status="parked">Park it</button></div></aside>`;
  }

  function screenActions(S, t, scr) {
    const noAct = (WF.OUTCOMES.find((o) => o.id === t.outcome) || {}).noAction;
    return html`${head(scr, t)}
      ${noAct && !t.actions.length ? html`<p class="notice plain">You've landed somewhere that doesn't need an action, and that's a complete result. Add one only if it helps.</p>` : ''}
      <ul class="rows">${t.actions.map((a) => actionCard(S, t, a))}</ul>
      <button class="btn small" data-do="add-action">${t.actions.length ? 'Add another' : 'Add an action'}</button>
      ${navrow(t, scr, { label: 'Continue' })}`;
  }

  function dateChips(selected, name) {
    const opts = [['Tomorrow', isoIn(1)], ['In 3 days', isoIn(3)], ['Next week', isoIn(7)], ['In a month', isoIn(30)]];
    return html`<div class="chips" role="group" aria-label="When to come back">${opts.map(([l, v]) => html`<button class="chip-btn ${selected === v ? 'on' : ''}" aria-pressed="${selected === v ? 'true' : 'false'}" data-do="${name}" data-value="${v}">${l}</button>`)}<input class="line date" type="date" aria-label="Choose a date" data-do-change="${name}" value="${selected || ''}"></div>`;
  }

  function screenReview(S, t, scr) {
    return html`${head(scr, t)}
      ${dateChips(t.returnOn, 'return-date')}
      ${t.returnOn ? html`<p class="fine">Set for ${shortDate(t.returnOn)}. <button class="link" data-do="ics">Add to my calendar</button> <button class="link" data-do="return-clear">Clear</button></p>` : ''}
      <label class="fieldlabel" for="r1">What will tell you whether you're making progress?</label>
      <textarea class="write" id="r1" data-bind="a/r.evidence" rows="3">
${t.a['r.evidence'] || ''}</textarea>
      <label class="fieldlabel" for="r2">Anything you learned that might be useful elsewhere?</label>
      <textarea class="write" id="r2" data-bind="a/r.learned" rows="3">
${t.a['r.learned'] || ''}</textarea>
      ${navrow(t, scr, { label: 'See your Thinking Brief' })}`;
  }

  /* -- Exercise runner -------------------------------------------------------------- */

  function exercise(S, t, ex) {
    const tech = WF.TECHNIQUES[ex.tech];
    const total = tech.steps.length;
    const atDebrief = ex.step >= total;
    const step = tech.steps[ex.step];
    const P = `exercises/#${ex.id}/answers`;
    const pct = Math.round((Math.min(ex.step, total) / total) * 100);
    const inner = atDebrief ? exDebrief(S, t, ex, tech) : exStep(S, t, ex, tech, step, P);
    const stage = M.stageOfScreen(t.cursor);
    return threadShell(S, t, stage, html`
      <div class="exbar"><p class="eyebrow">${tech.name} · ${atDebrief ? 'Debrief' : `Step ${ex.step + 1} of ${total}`}</p><button class="link" data-do="ex-leave">Leave for now</button></div>
      <div class="meter" role="progressbar" aria-label="Exercise progress" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      ${ex.step === 0 && tech.intro ? html`<p class="intro">${tech.intro}</p>` : ''}
      ${ex.step === 0 && tech.caution ? html`<p class="caution">${tech.caution}</p>` : ''}
      ${inner}
      ${atDebrief ? '' : html`<details class="example"><summary>See an example</summary><p><span>Before</span>${tech.example.before}</p><p><span>After</span>${tech.example.after}</p></details>`}`);
  }

  function exStep(S, t, ex, tech, step, P) {
    const a = ex.answers;
    const hd = html`<h1 class="q" id="q" tabindex="-1">${step.q}</h1><p class="why">${step.why}</p>`;
    const back = ex.step > 0 ? html`<button class="btn quiet" data-do="ex-back">Back</button>` : html`<span></span>`;
    const nav = (label, extra) => html`<div class="navrow">${back}<button class="btn primary" data-do="ex-next" data-primary ${raw(extra || '')}>${label || 'Continue'}</button></div>`;
    switch (step.kind) {
      case 'text':
        return html`${hd}${ta(t, `${P}/${step.id}`, { labelledby: 'q', autofocus: true, placeholder: step.hint })}${nav()}`;
      case 'list':
        return html`${hd}${step.hint ? html`<p class="fine">${step.hint}</p>` : ''}
          <ul class="rows">${(a[step.id] || []).map((x, n) => html`<li class="irow"><input class="line" data-bind="${P}/${step.id}/#${x.id}/text" value="${x.text}" aria-label="Item ${n + 1}" data-enter="ex-add" data-step="${step.id}" ${raw(n === (a[step.id] || []).length - 1 ? 'data-autofocus' : '')}><button class="iconbtn" data-do="ex-del" data-step="${step.id}" data-id="${x.id}" aria-label="Remove">×</button></li>`)}</ul>
          <button class="btn small" data-do="ex-add" data-step="${step.id}">${step.add || 'Add another'}</button>${nav()}`;
      case 'each': {
        const src = (a[step.from] || []).filter((x) => M.has(x.text));
        if (!src.length) return html`${hd}<p class="empty">Nothing listed in the previous step, so there's nothing to do here.</p>${nav()}`;
        return html`${hd}<ul class="rows">${src.map((x) => {
          const r = (a[step.id] || {})[x.id] || {};
          return html`<li class="card idea"><p class="idea-t">${x.text}</p>
            ${step.options ? radios(`e${x.id}`, `${P}/${step.id}/${x.id}/pick`, step.options.map((o) => [o, o]), r.pick || '', { label: x.text }) : ''}
            <textarea class="line" rows="2" data-bind="${P}/${step.id}/${x.id}/text" placeholder="${step.placeholder || ''}" aria-label="${x.text}">
${r.text || ''}</textarea></li>`;
        })}</ul>${nav()}`;
      }
      case 'pick': {
        const src = (a[step.from] || []).filter((x) => M.has(x.text));
        if (!src.length) return html`${hd}<p class="empty">Nothing to pick from, so you can move on.</p>${nav()}`;
        return html`${hd}<div class="outcomes" role="radiogroup" aria-label="${step.q}">${src.map((x) => html`<label class="outcome"><input type="radio" name="p${step.id}" value="${x.id}" data-bind="${P}/${step.id}" ${raw(a[step.id] === x.id ? 'checked' : '')}><span><strong>${x.text}</strong></span></label>`)}</div>${nav()}`;
      }
      case 'action': {
        const cur = a[step.id] || {};
        const open = M.openActions(t);
        return html`${hd}${open.length ? html`<div class="outcomes" role="radiogroup" aria-label="${step.q}">${open.map((x) => html`<label class="outcome"><input type="radio" name="plan" data-do-change="ex-plan" data-step="${step.id}" value="${x.id}" ${raw(cur.id === x.id ? 'checked' : '')}><span><strong>${x.text}</strong></span></label>`)}</div><p class="fieldlabel">Or describe something else</p>` : ''}
          <textarea class="write" rows="3" data-bind="${P}/${step.id}/text" aria-labelledby="q" data-clear-plan="${step.id}">
${cur.text || ''}</textarea>${nav()}`;
      }
      case 'check': {
        const v = a[step.id] || {};
        const all = step.checks.every((_, i) => v[i]);
        return html`${hd}<div class="checks">${step.checks.map((c, i) => html`<label class="checkrow"><input type="checkbox" data-bind="${P}/${step.id}/${i}" data-rerender ${raw(v[i] ? 'checked' : '')}><span>${c}</span></label>`)}</div>
          <div class="navrow">${back}<div class="navright"><button class="btn quiet" data-do="ex-stop">${step.stopLabel}</button><button class="btn primary" data-do="ex-next" data-primary ${raw(all ? '' : 'disabled')}>Continue</button></div></div>`;
      }
      case 'timer': {
        const end = a[`${step.id}_end`];
        const left = end ? end - M.now() : 0;
        return html`${hd}<div class="timer"><output data-timer="${end || 0}" data-mins="${step.minutes}">${fmtTimer(end ? left : step.minutes * 60000)}</output>
          ${end ? (left > 0 ? html`<button class="btn" data-do="ex-timer-stop" data-step="${step.id}">I'm done early</button>` : html`<p>Time's up.</p>`) : html`<button class="btn primary" data-do="ex-timer" data-step="${step.id}" data-mins="${step.minutes}">Start the timer</button>`}</div>${nav(end ? 'Continue' : 'Skip the timer')}`;
      }
      case 'away':
        return html`${hd}<div class="navrow">${back}<div class="navright"><button class="btn quiet" data-do="ex-wait">I'll do it later</button><button class="btn primary" data-do="ex-next" data-primary>I've done it</button></div></div>`;
      default:
        return '';
    }
  }

  const fmtTimer = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  function exDebrief(S, t, ex, tech) {
    const opts = M.carryOptions(ex);
    return html`<h1 class="q" id="q" tabindex="-1">${tech.debrief}</h1>
      ${tech.note ? html`<p class="why">${tech.note}</p>` : ''}
      ${ta(t, `exercises/#${ex.id}/debrief`, { labelledby: 'q', autofocus: true, rows: 4 })}
      ${opts.length ? html`<fieldset class="carry"><legend>Take this with you</legend>${opts.map((c) => html`<label class="checkrow"><input type="checkbox" data-carry="${c.key}" checked><span><strong>${c.label}</strong><small>${clip(c.text, 160)}</small></span></label>`)}</fieldset>` : ''}
      <div class="navrow"><button class="btn quiet" data-do="ex-back">Back</button><button class="btn primary" data-do="ex-finish" data-primary>Finish</button></div>`;
  }

  /* -- Coming back and leaving ------------------------------------------------------ */

  function welcomeBack(S, t) {
    const prev = t.sittings.length > 1 ? t.sittings[t.sittings.length - 2] : null;
    const lastAt = prev ? prev.last : M.sitting(t).start;
    const gap = M.now() - lastAt;
    const s = M.summary(t);
    const openA = M.openActions(t);
    const wait = M.waitingExercises(t);
    const running = t.cursorEx && t.exercises.find((e) => e.id === t.cursorEx && e.status === 'active');
    const rows = [['The problem', s.problem || t.a['d.open']], ['What you want', s.want], ['Leverage point', s.leverage], ['Decided', t.a['a.decision']]].filter(([, v]) => M.has(v));
    const allClosed = t.actions.length && !openA.length && t.actions.some((a) => a.state !== 'open');
    const fresh = gap < 3600000;
    return threadShell(S, t, 'back', html`
      <p class="eyebrow">${M.sittingCount(t) > 1 ? `Sitting ${M.sittingCount(t) + 1}` : 'Your second sitting'}</p>
      <h1 class="q" id="q" tabindex="-1">Welcome back.</h1>
      <p class="why">${fresh ? 'You were here a moment ago.' : `You were last here ${ago(lastAt)}, on ${weekday(lastAt)}.`} Take a minute to get your bearings.</p>
      ${t.nextNote ? html`<blockquote class="echo note"><span>You left yourself a note</span>${t.nextNote}</blockquote>` : ''}
      ${M.isLongGap(gap) && M.has(s.problem) ? html`<aside class="notice"><p>It's been a while, and things may have moved on. Is this still the problem?</p><blockquote class="echo">${s.problem}</blockquote><div><button class="btn small" data-do="ack-long">Still true</button> <a class="btn quiet small" href="#/t/${t.id}/s/d.sum">Update it</a></div></aside>` : ''}
      ${openA.length ? html`<section class="stack"><h2 class="sec">How did these go?</h2>${openA.map((a) => html`<article class="card action"><p class="eyebrow">${WF.ACTION_TYPES[a.type].label}${a.when ? ` · ${shortDate(a.when)}` : ''}</p><p class="idea-t">${a.text}</p>${checkin(S, t, a)}</article>`)}<p class="fine">Not got to these yet? That's fine. Leave them and carry on.</p></section>` : ''}
      ${allClosed ? whatNow(t) : ''}

${t.changeDraft}</textarea>

  function pause(S, t) {

  function briefRow(S, t, row, full) {

  function printDoc(t, full) {

        const lines = r.kind === 'wants' ? B.liveWants(t).map((w) => `${w.text} (${WF.WANT_KINDS[w.kind].toLowerCase()})`)

  }

  function data(S) {
    const m = S.store;
    return publicShell(S, html`<div class="col single">
      <h1 class="q" id="q" tabindex="-1">Backup &amp; data</h1>

      <section class="card"><h2>Backup</h2>
        <p>${S.lastBackupAt ? `Last backup: ${new Date(S.lastBackupAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })} (${ago(S.lastBackupAt)}).` : 'No backup yet.'} ${S.threadCount} thread${S.threadCount === 1 ? '' : 's'} on this device.</p>
        <div class="card-do"><button class="btn primary" data-do="backup">Export all threads</button><label class="btn">Import a backup<input type="file" accept=".json,application/json" class="sr" data-import></label></div>
        <p class="fine">To move to another device: export here, transfer the file, import there. If the same thread changed on both, you keep both copies. Backup files aren't encrypted, so keep them somewhere private.</p>
      </section>
      <section class="card"><h2>Is it safe here?</h2>
        <ul class="plain">
          <li>Storage: ${{ indexeddb: 'browser database', localstorage: 'basic browser storage', memory: 'none available. Work will be lost when this tab closes' }[m.mode]}${m.usage ? ` (${m.usage} used)` : ''}.</li>
          <li>${m.persisted ? 'The browser has agreed to keep this data under storage pressure.' : "The browser hasn't promised to keep this data. It may clear it if space runs low."}</li>
          <li>Safari may delete data for sites you haven't visited in 7 days, unless you add Wayfinder to your Home Screen.</li>
          <li>Anyone who can use this browser profile can read your threads. On a shared computer, delete them when you finish.</li>
        </ul>
        ${S.canInstall ? html`<button class="btn" data-do="install">Install Wayfinder</button>` : ''}
      </section>
      <section class="card"><h2>Appearance</h2>${radios('theme', 'theme', [['auto', 'Match device'], ['light', 'Light'], ['dark', 'Dark']], S.theme, { label: 'Theme' })}</section>
      <section class="card"><h2>For pilots</h2>
        <p>Counts only, with none of your words: sittings, stages reached, which exercises you tried. Nothing is sent. It's copied for you to share if you choose.</p>
        <details class="example"><summary>Exactly what would be copied</summary><pre class="stats">${S.stats}</pre></details>
        <button class="btn" data-do="copy-stats">Copy anonymous stats</button>
      </section>
      <section class="card danger-card"><h2>Delete everything</h2><p>Removes all threads from this browser. This can't be undone.</p><button class="btn danger" data-do="delete-all">Delete all local data</button></section>
    </div>`);
  }

  function about(S) {
    return publicShell(S, html`<div class="col single prose">
      <h1 class="q" id="q" tabindex="-1">About Wayfinder</h1>
      <p class="why">A private, offline place to work through something that matters, and leave with a clear next move.</p>
      <p>Wayfinder guides you through five stages and offers short exercises when they might help. It has no AI, no account, no server and no tracking. All suggestions come from fixed rules that you can see, and everything in your brief is your own words.</p>
      <h2>What it isn't</h2>
      <p>It's a reflection and problem-solving aid. It isn't therapy, a diagnosis, or advice, and it won't tell you what to value or what to do. <a href="#/support">If you need more support</a>, please reach out to a person.</p>
      <h2>Where the ideas come from</h2>
      <ul><li>The four questions behind the stages are from Henrik Karlsson's essay "Four Useful Questions".</li>
      <li>Most of the exercises draw on the Center for Applied Rationality's handbook.</li>
      <li>Focusing was developed by Eugene Gendlin.</li>
      <li>Hamming Questions are named after Richard Hamming's talk "You and Your Research".</li></ul>

  function support(S) {

  WF.views = {
    html, raw, ago, clip, isoIn, shortDate, fmtTimer,

  };

/* Wayfinder app: routing, saving, and everything that happens on a click or keystroke. */
(function () {
  const WF = globalThis.WF;
  const M = WF.model;
  const V = WF.views;
  const store = WF.store;
  const root = document.getElementById('app');
  const TAB = M.uid();
  const AUTOSAVE_MS = 350;
  const BACKUP_NUDGE_DAYS = 7;

  const S = {
    t: null, threads: [], device: '', dirty: false, saveText: 'Saved on this device', saveFailed: false,
    promptAt: {}, angle: 0, anglePrompt: 0, openDetails: {}, checkin: {}, checkinOpen: '',
    showSupport: false, showEmpty: false, finishDismissed: false, pauseNote: null, pauseDate: '',
    needsBackup: false, lastBackupAt: 0, theme: 'auto', canInstall: false, threadCount: 0, stats: '', store: {}, routeKey: ''
  };
  let saveTimer = null;
  let renderSeq = 0;
  let installEvent = null;
  let undoTimer = null;
  let pendingDelete = null;
  let waitingWorker = null;
  const channel = 'BroadcastChannel' in window ? new BroadcastChannel('wayfinder') : null;

  const $ = (s, r = document) => r.querySelector(s);
  const go = (path) => { location.hash = path; };
  const replace = (path) => { history.replaceState(null, '', `#${path}`); render(); };

  /* -- Saving ----------------------------------------------------------------------- */

  function setSave(text, failed) {
    S.saveText = text;
    S.saveFailed = !!failed;
    const el = $('#save');
    if (el) {
      el.textContent = text;
      el.classList.toggle('fail', !!failed);
    }
    showSaveFailure();
  }

  function showSaveFailure() {
    let bar = $('#savefail');
    if (S.saveFailed && !bar) {
      bar = document.createElement('div');
      bar.id = 'savefail';
      bar.setAttribute('role', 'alert');
      const msg = document.createElement('p');
      msg.textContent = store.mode() === 'memory'
        ? "This browser is blocking storage, so your work will be lost when this tab closes. A private window is the usual cause."
        : "Your latest changes couldn't be saved. The browser's storage may be full.";
      bar.append(msg);
      if (S.t) {
        const b = document.createElement('button');
        b.className = 'btn small';
        b.dataset.do = 'export-json';
        b.textContent = 'Export this thread now';
        bar.append(b);
      }
      document.body.append(bar);
    } else if (!S.saveFailed && bar) bar.remove();
  }

  function markDirty() {
    S.dirty = true;
    setSave('Saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, AUTOSAVE_MS);
  }

  async function flush() {
    clearTimeout(saveTimer);
    if (!S.t || !S.dirty) return;
    S.dirty = false;
    M.bump(S.t, S.device);
    try {
      await store.put(S.t);
      const memory = store.mode() === 'memory';
      setSave(memory ? 'Not saved: storage blocked' : navigator.onLine === false ? 'Offline — saved locally' : 'Saved on this device', memory);
      if (channel) channel.postMessage({ type: 'saved', id: S.t.id, tab: TAB });
    } catch {
      S.dirty = true;
      setSave("Couldn't save", true);
    }
  }

  async function pullLatest() {
    if (!S.t || S.dirty) return;
    const fresh = await store.get(S.t.id);
    if (fresh && M.SUM(fresh.vv) > M.SUM(S.t.vv)) {
      S.t = M.normalize(fresh);
      render({ keep: true });
    }
  }

  /* -- Render ----------------------------------------------------------------------- */

  async function enterThread(id, rest) {
    if (S.t && S.t.id !== id) await leaveThread();
    if (!S.t) {
      const t = await store.get(id);
      if (!t || t.deletedAt) return null;
      S.t = M.normalize(t);
      S.showSupport = false;
      S.finishDismissed = false;
    }
    if (rest[0] !== 'back' && rest[0] !== 'pause' && M.isReturning(S.t)) {
      M.startSitting(S.t);
      S.dirty = true;
      await flush();
      return 'back';
    }
    return S.t;
  }

  async function leaveThread() {
    if (S.dirty) await flush();
    S.t = null;
  }

  async function loadHome() {
    S.threads = (await store.all()).filter((t) => !t.deletedAt).map(M.normalize);
    S.threadCount = S.threads.length;
    S.lastBackupAt = await store.getMeta('lastBackupAt', 0);
    const unbacked = S.threads.some((t) => !t.example && t.updatedAt > S.lastBackupAt);
    const started = S.threads.filter((t) => !t.example).reduce((min, t) => Math.min(min, t.createdAt), Infinity);
    S.needsBackup = unbacked && M.now() - Math.max(S.lastBackupAt, started) > BACKUP_NUDGE_DAYS * M.DAY;
  }

  async function loadData() {
    await loadHome();
    const est = await store.estimate();
    let persisted = false;
    try { persisted = !!(navigator.storage && (await navigator.storage.persisted())); } catch { /* Not available on file:. */ }
    S.store = { mode: store.mode(), persisted, usage: est && est.usage ? `${(est.usage / 1048576).toFixed(1)} MB` : '' };
    S.stats = JSON.stringify(M.anonymousStats(S.threads), null, 2);
  }

  async function render(o = {}) {
    const seq = ++renderSeq;
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    const scroll = document.scrollingElement.scrollTop;
    const key = location.hash;
    let out;
    if (parts[0] === 't' && parts[1]) {
      const rest = parts.slice(2);
      const r = await enterThread(parts[1], rest);
      if (!r) return replace('/');
      if (r === 'back') return replace(`/t/${parts[1]}/back`);
      out = threadView(rest);
      if (out === null) return undefined;
    } else {
      await leaveThread();
      S.routeTech = '';
      if (parts[0] === 'new') out = V.newThread(S);
      else if (parts[0] === 'library' && parts[1] && WF.TECHNIQUES[parts[1]]) { await loadHome(); out = V.techPage(S, null, WF.TECHNIQUES[parts[1]]); }
      else if (parts[0] === 'library') out = V.library(S, null);
      else if (parts[0] === 'data') { await loadData(); out = V.data(S); }
      else if (parts[0] === 'about') out = V.about(S);
      else if (parts[0] === 'support') out = V.support(S);
      else { await loadHome(); out = V.home(S); }
    }
    if (seq !== renderSeq) return undefined; // A newer navigation overtook this one.
    root.innerHTML = out.s;
    afterRender(key === S.routeKey || o.keep, scroll, o.focus);
    S.routeKey = key;
    return undefined;
  }

  function threadView(rest) {
    const t = S.t;
    const [kind, arg] = rest;
    if (kind === 'back') return V.welcomeBack(S, t);
    if (kind === 'pause') return V.pause(S, t);
    if (kind === 'brief') return V.brief(S, t, arg === 'full');
    if (kind === 'o' && M.STAGE_IDS.includes(arg)) return V.overview(S, t, arg);
    if (kind === 'library') return arg && WF.TECHNIQUES[arg] ? V.techPage(S, t, WF.TECHNIQUES[arg]) : V.library(S, t);
    if (kind === 'x') {
      const ex = t.exercises.find((e) => e.id === arg);
      if (!ex) { replace(`/t/${t.id}`); return null; }
      if (t.cursorEx !== ex.id) { t.cursorEx = ex.id; markDirty(); }
      if (ex.status === 'waiting') ex.status = 'active';
      prepareStep(ex, t);
      return V.exercise(S, t, ex);
    }
    if (kind === 's' && M.screenById(arg) && M.screenById(arg).id === arg) {
      if (t.cursor !== arg || t.cursorEx) { t.cursor = arg; t.cursorEx = ''; markDirty(); }
      return V.screen(S, t, M.screenById(arg));
    }
    const ex = t.cursorEx && t.exercises.find((e) => e.id === t.cursorEx && e.status === 'active');
    replace(ex ? `/t/${t.id}/x/${ex.id}` : `/t/${t.id}/s/${t.cursor}`);
    return null;
  }

  function prepareStep(ex, t) {
    const step = WF.TECHNIQUES[ex.tech].steps[ex.step];
    if (step && step.kind === 'list' && !ex.answers[step.id]) {
      const seeded = step.seed ? step.seed(t) : [];
      ex.answers[step.id] = (seeded.length ? seeded : ['']).map((text) => ({ id: M.uid(), text }));
    }
  }

  function growAll() {
    root.querySelectorAll('textarea').forEach(grow);
  }

  function grow(el) {
    if (!el.offsetParent) return;
    el.style.height = 'auto';
    el.style.height = `${el.scrollHeight + 2}px`;
  }

  function afterRender(sameRoute, scroll, focusSel) {
    growAll();
    if (focusSel) {
      const el = $(focusSel);
      if (el) { el.focus(); moveCaret(el); }
    }
    if (sameRoute) { document.scrollingElement.scrollTop = scroll; return; }
    window.scrollTo(0, 0);
    const main = $('#main');
    const auto = $('[data-autofocus]');
    if (auto && matchMedia('(pointer: fine)').matches) { auto.focus(); moveCaret(auto); return; }
    const h = $('#q') || $('h1');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } else if (main) main.focus({ preventScroll: true });
  }

  function moveCaret(el) {
    if (el.setSelectionRange && el.type !== 'date' && el.type !== 'radio') {
      try { el.setSelectionRange(el.value.length, el.value.length); } catch { /* Not a text field. */ }
    }
  }

  /* -- Input ------------------------------------------------------------------------ */

  function onInput(e) {
    const el = e.target;
    if (el.tagName === 'TEXTAREA') grow(el);
    if (el.dataset.bind === 'theme') return setTheme(el.value);
    if ('search' in el.dataset) return searchThreads(el.value);
    if (!el.dataset.bind || !S.t) return undefined;
    if (el.type === 'radio' && !el.checked) return undefined;
    const path = el.dataset.bind;
    const value = el.type === 'checkbox' ? el.checked : 'num' in el.dataset ? Number(el.value) : el.value;
    const prev = M.getPath(S.t, path);
    M.setPath(S.t, path, value);
    M.recordEdit(S.t, path, prev);
    if (path === 'title') { const tt = $('.tb-t'); if (tt) tt.textContent = value; }
    if (el.dataset.clearPlan) {
      const ex = currentEx();
      if (ex && ex.answers[el.dataset.clearPlan]) delete ex.answers[el.dataset.clearPlan].id;
      root.querySelectorAll('input[name="plan"]').forEach((r) => { r.checked = false; });
    }
    root.querySelectorAll('[data-bind]').forEach((other) => {
      if (other !== el && other.dataset.bind === path && other.type !== 'radio') { other.value = value; grow(other); }
    });
    if (el.tagName === 'TEXTAREA' && M.supportNeeded(S.t, el.value)) {
      S.t.supportShown = true;
      S.showSupport = true;
      const slot = $('#support-slot');
      if (slot) slot.innerHTML = V.supportCard().s;
    }
    const scr = S.t && M.screenById(S.t.cursor);
    const cont = $('[data-cont]');
    if (cont && scr && scr.field && path === `a/${scr.field}` && scr.type !== 'review') cont.textContent = M.has(String(value)) ? 'Continue' : 'Skip for now';
    markDirty();
    if ('rerender' in el.dataset) render({ keep: true });
    else if (path.startsWith('actions') || path.startsWith('ideas')) refreshPanel();
    return undefined;
  }

  function searchThreads(query) {
    let shown = 0;
    root.querySelectorAll('[data-tid]').forEach((card) => {
      const t = S.threads.find((x) => x.id === card.dataset.tid);
      card.hidden = !t || !M.matchesSearch(t, query);
      if (!card.hidden) shown++;
    });
    root.querySelectorAll('[data-tsec]').forEach((sec) => { sec.hidden = !sec.querySelector('[data-tid]:not([hidden])'); });
    $('#search-none').textContent = shown ? '' : 'Nothing matches that.';
  }

  function refreshPanel() {
    const p = $('#panel');
    if (!p || !S.t || p.contains(document.activeElement)) return;
    const open = p.classList.contains('open');
    p.outerHTML = V.panel(S, S.t).s;
    if (open) $('#panel').classList.add('open');
    growAll();
  }

  const currentEx = () => S.t && S.t.exercises.find((e) => e.id === S.t.cursorEx);

  function exProgress(fn) {
    const ex = currentEx();
    if (!ex) return;
    fn(ex);
    ex.updatedAt = M.now();
    S.t.updatedAt = ex.updatedAt;
    const s = M.sitting(S.t);
    if (s) { s.edits++; s.last = ex.updatedAt; }
    markDirty();
  }

  function addListItem(step) {
    let added = '';
    exProgress((ex) => {
      const l = ex.answers[step] || (ex.answers[step] = []);
      const blank = l.find((x) => !M.has(x.text));
      if (blank) { added = blank.id; return; }
      added = M.uid();
      l.push({ id: added, text: '' });
    });
    render({ keep: true, focus: `[data-bind$="${step}/#${added}/text"]` });
  }

  function touch() {
    const at = M.now();
    S.t.updatedAt = at;
    const s = M.sitting(S.t);
    if (s) { s.edits++; s.last = at; }
    markDirty();
  }

  function toast(text, undo) {
    const el = $('#toast');
    el.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = text;
    el.append(span);
    if (undo) {
      const b = document.createElement('button');
      b.textContent = 'Undo';
      b.className = 'link';
      b.onclick = () => { clearTimeout(undoTimer); el.classList.remove('on'); undo(); };
      el.append(b);
    }
    el.classList.add('on');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => {
      el.classList.remove('on');
      if (pendingDelete) { pendingDelete(); pendingDelete = null; }
    }, undo ? 8000 : 3500);
  }

  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // Filenames sit in a Downloads folder in plain view, so they carry a date and no user text.
  const fileBase = () => `wayfinder-brief-${M.todayIso()}`;
  const isFull = () => location.hash.endsWith('/brief/full');

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.append(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
  }

  /* A reminder that lands in the user's own calendar. Generic on purpose: a calendar is
     often shared or synced, so none of their words go into it. */
  function ics(iso) {
    const d = iso.replace(/-/g, '');
    const end = new Date(`${iso}T00:00:00`);
    end.setDate(end.getDate() + 1);
    const e = `${end.getFullYear()}${String(end.getMonth() + 1).padStart(2, '0')}${String(end.getDate()).padStart(2, '0')}`;
    const stamp = new Date(M.now()).toISOString().replace(/[-:]|\.\d+/g, '');
    download('wayfinder-return.ics', ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Wayfinder//EN', 'BEGIN:VEVENT', `UID:${M.uid()}@wayfinder.local`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${e}`, 'SUMMARY:Return to Wayfinder', 'END:VEVENT', 'END:VCALENDAR', ''].join('\r\n'), 'text/calendar');
  }

  function dialog({ title, body, confirm, danger, typed }) {
    return new Promise((ok) => {
      const d = document.createElement('dialog');
      d.innerHTML = V.html`<form method="dialog"><h2>${title}</h2><p>${body}</p>${typed ? V.html`<input class="line" aria-label="Type ${typed} to confirm" placeholder="Type ${typed}" autocomplete="off">` : ''}<div class="card-do"><button class="btn quiet" value="no">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" value="yes" ${V.raw(typed ? 'disabled' : '')}>${confirm}</button></div></form>`.s;
      document.body.append(d);
      const input = $('input', d);
      if (input) input.oninput = () => { $('[value=yes]', d).disabled = input.value.trim().toLowerCase() !== typed; };
      // Answers come from the click itself: the close event can arrive late in a background
      // window, and an import or delete shouldn't wait on that.
      const finish = (yes) => { d.close(); d.remove(); ok(yes); };
      d.addEventListener('click', (e) => {
        const b = e.target.closest('button[value]');
        if (!b) return;
        e.preventDefault();
        finish(b.value === 'yes');
      });
      d.addEventListener('cancel', (e) => { e.preventDefault(); finish(false); });
      d.showModal();
    });
  }

  async function backupAll() {
    await flush();
    const threads = (await store.all()).filter((t) => !t.deletedAt);
    download(`wayfinder-backup-${M.todayIso()}.json`, JSON.stringify(M.makeBackup(threads), null, 1), 'application/json');
    const at = M.now();
    await store.setMeta('lastBackupAt', at);
    S.lastBackupAt = at;
    toast('Backup saved to your downloads.');
    if (!S.t) render({ keep: true });
  }

  async function importFile(file) {
    let incoming;
    try {
      incoming = M.parseBackup(await file.text());
    } catch (err) {
      await dialog({ title: "That file couldn't be imported", body: err.message, confirm: 'OK' });
      return;
    }
    const plan = M.planImport(incoming, (await store.all()).map(M.normalize));
    const n = (a) => plan.filter((p) => p.action === a).length;
    const parts = [
      n('add') && `${n('add')} new`,
      n('replace') && `${n('replace')} updated to a newer version`,
      n('copy') && `${n('copy')} changed in both places, so both copies will be kept`,
      n('skip') && `${n('skip')} already up to date`
    ].filter(Boolean);
    if (!(n('add') + n('replace') + n('copy'))) {
      await dialog({ title: 'Nothing to import', body: `This backup has ${plan.length} thread${plan.length === 1 ? '' : 's'}, and all are already up to date here.`, confirm: 'OK' });
      return;
    }
    const yes = await dialog({ title: 'Import this backup?', body: `${parts.join(', ')}. Nothing on this device will be lost.`, confirm: 'Import' });
    if (!yes) return;
    for (const p of plan) {
      if (p.action === 'add' || p.action === 'replace') await store.put(p.thread);
      if (p.action === 'copy') await store.put(M.asCopy(p.thread));
    }
    toast('Backup imported.');
    render({ keep: true });
  }

  function setTheme(v) {
    S.theme = v;
    document.documentElement.dataset.theme = v;
    store.setMeta('theme', v);
  }

  async function finishExercise() {
    const ex = currentEx();
    const chosen = new Set([...root.querySelectorAll('[data-carry]:checked')].map((c) => c.dataset.carry));
    for (const c of M.carryOptions(ex)) if (chosen.has(c.key)) M.applyCarry(S.t, c);
    ex.status = 'done';
    S.t.cursorEx = '';
    touch();
    await flush();
    toast(chosen.size ? 'Added to your thread.' : 'Exercise saved in your working record.');
    go(`/t/${S.t.id}/s/${ex.returnTo || S.t.cursor}`);
  }

  function setReturn(v) {
    S.t.returnOn = v;
    touch();
    render({ keep: true });
  }

  /* -- Actions ---------------------------------------------------------------------- */

  const DO = {
    async create() {
      const text = $('#new-text').value;
      if (!M.has(text)) { $('#new-text').focus(); toast('Write a few words first. It can be rough.'); return; }
      const t = M.newThread(text, S.device);
      t.fieldSitting['d.open'] = t.sittings[0].id;
      await store.put(t);
      S.t = t;
      go(`/t/${t.id}/s/d.entry`);
    },
    async example() {
      const t = M.exampleThread();
      t.vv[S.device] = 1;
      await store.put(t);
      go(`/t/${t.id}/brief`);
    },
    next() {
      const n = M.nextScreen(S.t.cursor);
      if (n) return go(`/t/${S.t.id}/s/${n}`);
      S.t.finished = true;
      touch();
      return go(`/t/${S.t.id}/brief`);
    },
    entry(el) {
      const o = WF.ENTRY.find((x) => x.id === el.dataset.id);
      S.t.entry = o.id;
      touch();
      go(`/t/${S.t.id}/s/${o.to}`);
    },
    'prompt-more'(el) {
      const id = el.dataset.id;
      S.promptAt[id] = (S.promptAt[id] || 0) + 2;
      render({ keep: true });
    },
    angle() {
      if (S.anglePrompt % 3 === 2) S.angle++;
      S.anglePrompt++;
      render({ keep: true, focus: '.angle .link' });
    },
    route(el) {
      const stage = el.dataset.stage;
      const o = WF.ROUTES[stage].options.find((x) => x.id === el.dataset.id);
      S.t.routes[stage] = { opt: o.id, tech: o.tech || '' };
      touch();
      if (!o.tech) return DO.next();
      return render();
    },
    'route-other'(el) {
      const stage = el.dataset.stage;
      const r = S.t.routes[stage];
      const alts = WF.ROUTES[stage].alternates;
      r.tech = alts[(alts.indexOf(r.tech) + 1) % alts.length];
      touch();
      render({ keep: true });
    },
    'route-reset'(el) {
      delete S.t.routes[el.dataset.stage];
      touch();
      render();
    },
    'start-tech'(el) {
      const tech = el.dataset.tech;
      if (!S.t) { // Started from the public library, so it needs a thread first.
        loadHome().then(async () => {
          const d = document.createElement('dialog');
          d.innerHTML = `<form method="dialog"><h2>Use this on what?</h2>${V.pickThread(S, tech).s}<div class="card-do"><button class="btn quiet" value="no">Cancel</button></div></form>`;
          document.body.append(d);
          d.onclose = () => d.remove();
          d.addEventListener('click', (e) => { if (e.target.closest('a,[data-do]')) d.close(); });
          d.showModal();
        });
        return;
      }
      const stage = el.dataset.stage || M.stageOfScreen(S.t.cursor);
      const ex = M.startExercise(S.t, tech, stage, S.t.cursor, el.dataset.because);
      S.t.cursorEx = ex.id;
      touch();
      go(`/t/${S.t.id}/x/${ex.id}`);
    },
    async 'tech-on'(el) {
      const t = M.normalize(await store.get(el.dataset.id));
      const ex = M.startExercise(t, el.dataset.tech, M.stageOfScreen(t.cursor), t.cursor, '');
      t.cursorEx = ex.id;
      await store.put(t);
      go(`/t/${t.id}/x/${ex.id}`);
    },
    'ex-next'() {
      exProgress((ex) => { ex.step++; });
      render();
    },
    'ex-back'() {
      exProgress((ex) => { ex.step = Math.max(0, ex.step - 1); });
      render();
    },
    'ex-add'(el) { addListItem(el.dataset.step); },
    'ex-del'(el) {
      exProgress((ex) => { ex.answers[el.dataset.step] = ex.answers[el.dataset.step].filter((x) => x.id !== el.dataset.id); });
      render({ keep: true });
    },
    'ex-leave'() {
      const ex = currentEx();
      S.t.cursorEx = '';
      touch();
      toast('Your place is saved.');
      go(`/t/${S.t.id}/s/${ex.returnTo || S.t.cursor}`);
    },
    'ex-wait'() {
      const ex = currentEx();
      exProgress((x) => { x.status = 'waiting'; });
      S.t.cursorEx = '';
      toast("Saved. We'll ask how it went when you're back.");
      go(`/t/${S.t.id}/s/${ex.returnTo || S.t.cursor}`);
    },
    'ex-stop'() {
      const ex = currentEx();
      exProgress((x) => { x.status = 'done'; x.debrief = x.debrief || 'Decided against this one.'; });
      S.t.cursorEx = '';
      toast('Good call. Not doing it is always fine.');
      go(`/t/${S.t.id}/s/${ex.returnTo || S.t.cursor}`);
    },
    'ex-timer'(el) {
      exProgress((ex) => { ex.answers[`${el.dataset.step}_end`] = M.now() + Number(el.dataset.mins) * 60000; });
      render({ keep: true });
    },
    'ex-timer-stop'(el) {
      exProgress((ex) => { ex.answers[`${el.dataset.step}_end`] = M.now(); });
      render({ keep: true });
    },
    'ex-finish': finishExercise,
    'add-want'() {
      const id = M.uid();
      S.t.wants.push({ id, text: '', kind: 'goal' });
      touch();
      render({ keep: true, focus: `[data-bind="wants/#${id}/text"]` });
    },
    'add-action'() {
      const type = { test: 'experiment', learn: 'research' }[S.t.outcome] || 'action';
      const a = M.normalizeAction({ type });
      S.t.actions.push(a);
      touch();
      render({ keep: true, focus: `[data-bind="actions/#${a.id}/text"]` });
    },
    'del-item'(el) {
      const list = el.dataset.list;
      const i = S.t[list].findIndex((x) => x.id === el.dataset.id);
      if (i < 0) return;
      const [gone] = S.t[list].splice(i, 1);
      touch();
      render({ keep: true });
      if (M.has(gone.text)) toast('Removed.', () => { S.t[list].splice(i, 0, gone); touch(); render({ keep: true }); });
    },
    'pick-idea'(el) {
      const i = S.t.ideas.find((x) => x.id === el.dataset.id);
      const prev = S.t.a['l.pick'] || '';
      S.t.a['l.pick'] = i.text;
      M.recordEdit(S.t, 'a/l.pick', prev);
      markDirty();
      render({ keep: true });
    },
    ack(el) {
      S.t.ack[el.dataset.stage] = M.now();
      touch();
      render({ keep: true });
    },
    'ack-long'(el) {
      el.closest('.notice').remove();
    },
    'nudge-off'(el) {
      S.t.nudgeOff[el.dataset.stage] = true;
      touch();
      render({ keep: true });
    },
    'checkin-open'(el) {
      S.checkinOpen = S.checkinOpen === el.dataset.id ? '' : el.dataset.id;
      render({ keep: true });
    },
    'checkin-pick'(el) {
      S.checkin[el.dataset.id] = el.dataset.state;
      render({ keep: true, focus: `#ci-${el.dataset.id}` });
    },
    'checkin-save'(el) {
      const id = el.dataset.id;
      M.closeAction(S.t, id, S.checkin[id], ($(`#ci-${id}`) || {}).value);
      delete S.checkin[id];
      S.checkinOpen = '';
      touch();
      render({ keep: true });
      toast('Logged in your brief.');
    },
    'set-status'(el) {
      S.t.status = el.dataset.status;
      touch();
      flush().then(() => go('/'));
    },
    resume() {
      if (M.has(S.t.changeDraft)) { M.logCheckin(S.t, S.t.changeDraft); S.t.changeDraft = ''; touch(); }
      go(`/t/${S.t.id}`);
    },
    pause() {
      S.pauseNote = S.t.nextNote;
      S.pauseDate = S.t.returnOn;
      S.pauseFrom = location.hash;
      go(`/t/${S.t.id}/pause`);
    },
    'pause-cancel'() { location.hash = S.pauseFrom || `#/t/${S.t.id}`; },
    async 'pause-save'() {
      M.pause(S.t, $('#pause-note').value, S.pauseDate);
      S.dirty = true;
      await flush();
      S.t = null;
      toast('Saved. See you next time.');
      go('/');
    },
    'pause-date'(el) {
      S.pauseNote = $('#pause-note').value;
      S.pauseDate = S.pauseDate === el.dataset.value ? '' : el.dataset.value;
      render({ keep: true });
    },
    'return-date'(el) { setReturn(el.dataset.value); },
    'return-clear'() { setReturn(''); },
    ics() { ics(S.t.returnOn); },
    'ics-pause'() { ics(S.pauseDate); },
    'sheet-open'() {
      const p = $('#panel');
      p.classList.add('open');
      $('.sheet-back').classList.add('on');
      $('.p-close').focus();
    },
    'sheet-close'() {
      $('#panel').classList.remove('open');
      $('.sheet-back').classList.remove('on');
      const b = $('.summary-btn');
      if (b) b.focus();
    },
    'support-dismiss'() {
      S.showSupport = false;
      $('#support-slot').innerHTML = '';
    },
    'finish-dismiss'() {
      S.finishDismissed = true;
      render({ keep: true });
    },
    'go-back'(el, e) { e.preventDefault(); history.back(); },
    copy() { copyText(WF.brief.markdown(S.t, isFull())).then(() => toast('Copied.')); },
    print() {
      $('#print').innerHTML = V.printDoc(S.t, isFull()).s;
      window.print();
    },
    'export-md'() { download(`${fileBase(S.t)}.md`, WF.brief.markdown(S.t, isFull()), 'text/markdown'); },
    'export-txt'() { download(`${fileBase(S.t)}.txt`, WF.brief.text(S.t, isFull()), 'text/plain'); },
    async 'export-json'() { await flush(); download(`${fileBase(S.t)}.json`, JSON.stringify(M.makeBackup([S.t], 'thread'), null, 1), 'application/json'); },
    backup: backupAll,
    'copy-stats'() { copyText(S.stats).then(() => toast('Copied.')); },
    async install() {
      if (!installEvent) return;
      installEvent.prompt();
      await installEvent.userChoice;
      installEvent = null;
      S.canInstall = false;
      render({ keep: true });
    },
    async 'delete-thread'() {
      const t = S.t;
      t.deletedAt = M.now();
      S.dirty = true;
      await flush();
      S.t = null;
      const id = t.id;
      pendingDelete = () => store.del(id);
      go('/');
      toast('Thread deleted.', async () => {
        pendingDelete = null;
        t.deletedAt = 0;
        await store.put(t);
        render({ keep: true });
      });
    },
    async 'delete-all'() {
      const yes = await dialog({ title: 'Delete everything?', body: "All threads on this device will be gone. There's no undo. Export a backup first if you might want them.", confirm: 'Delete everything', danger: true, typed: 'delete' });
      if (!yes) return;
      await store.clearAll();
      S.t = null;
      toast('All local data deleted.');
      go('/');
      render();
    },
    update() {
      if (waitingWorker) waitingWorker.postMessage('skipWaiting');
    },
    'update-later'() { $('#updatebar').remove(); },
    skip() {
      const m = $('#main');
      if (m) m.focus();
    }
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-do]');
    if (el && DO[el.dataset.do]) DO[el.dataset.do](el, e);
  });

  document.addEventListener('input', onInput);

  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.import !== undefined && el.files[0]) { importFile(el.files[0]); el.value = ''; }
    if (el.dataset.doChange === 'return-date') setReturn(el.value);
    if (el.dataset.doChange === 'pause-date') { S.pauseNote = $('#pause-note').value; S.pauseDate = el.value; render({ keep: true }); }
    if (el.dataset.doChange === 'ex-plan') {
      exProgress((ex) => { ex.answers[el.dataset.step] = { id: el.value }; });
      const box = $('[data-clear-plan]');
      if (box) box.value = '';
    }
  });

  document.addEventListener('submit', (e) => {
    const f = e.target.closest('[data-submit="add-idea"]');
    if (!f) return;
    e.preventDefault();
    const inp = $('#idea-input');
    if (!M.has(inp.value)) return;
    S.t.ideas.push(M.normalize({ ideas: [{ text: inp.value.trim() }] }).ideas[0]);
    M.recordEdit(S.t, 'ideas', '');
    markDirty();
    render({ keep: true, focus: '#idea-input' });
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      const p = $('[data-primary]:not([disabled])');
      if (p) { e.preventDefault(); p.click(); }
    }
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) {
      e.preventDefault();
      const fn = e.target.dataset.enter;
      if (fn === 'ex-add') addListItem(e.target.dataset.step);
      else DO[fn](e.target);
    }
    if (e.key === 'Escape' && $('#panel.open')) DO['sheet-close']();
  });

  document.addEventListener('toggle', (e) => {
    const k = e.target.dataset && e.target.dataset.keep;
    if (k) S.openDetails[k] = e.target.open;
  }, true);

  window.addEventListener('hashchange', () => render());
  window.addEventListener('pagehide', flush);
  window.addEventListener('blur', flush);
  window.addEventListener('focus', pullLatest);
  window.addEventListener('online', () => setSave('Saved on this device'));
  window.addEventListener('offline', () => setSave('Offline — saved locally'));
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) return flush();
    await pullLatest();
    if (S.t && M.isReturning(S.t) && !location.hash.includes('/pause')) render();
    return undefined;
  });
  if (channel) {
    channel.onmessage = (e) => {
      if (S.t && e.data.id === S.t.id && e.data.tab !== TAB && !document.hasFocus()) pullLatest();
    };
  }

  /* Resolve Cycles stores an end time, so the countdown survives closing the app. */
  setInterval(() => {
    const el = $('[data-timer]');
    if (!el) return;
    const end = Number(el.dataset.timer);
    if (!end) return;
    const left = end - M.now();
    el.textContent = V.fmtTimer(left);
    if (left <= 0 && !el.dataset.over) { el.dataset.over = '1'; render({ keep: true }); }
  }, 1000);

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    installEvent = e;
    S.canInstall = true;
  });

  function updateBar(worker) {
    waitingWorker = worker;
    if ($('#updatebar')) return;
    const bar = document.createElement('div');
    bar.id = 'updatebar';
    bar.setAttribute('role', 'status');
    bar.innerHTML = '<p>A new version is ready. Your work is safe.</p><div><button class="btn quiet small" data-do="update-later">Later</button> <button class="btn small" data-do="update">Update now</button></div>';
    document.body.append(bar);
  }

  function registerWorker() {
    const httpish = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (!httpish) return; // Opened from disk: fully usable, but there's nothing to install.
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'manifest.webmanifest';
    document.head.append(link);
    if (!('serviceWorker' in navigator)) return;
    let reloading = false;
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', async () => {
      if (reloading || !hadController) return;
      reloading = true;
      await flush();
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').then((reg) => {
      if (reg.waiting && hadController) updateBar(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) updateBar(w);
        });
      });
    }).catch(() => { /* The app still works; it just won't install. */ });
  }

  async function boot() {
    await store.init();
    S.device = await store.getMeta('device', '');
    if (!S.device) {
      S.device = M.uid();
      await store.setMeta('device', S.device);
    }
    setTheme(await store.getMeta('theme', 'auto'));
    if (store.mode() === 'memory') setSave('Not saved: storage blocked', true);
    for (const t of await store.all()) if (t.deletedAt) await store.del(t.id);
    store.persist();
    registerWorker();
    render();
  }

  WF.app = { S, flush, render };
  boot();
})();
</script>
</body>
</html>
