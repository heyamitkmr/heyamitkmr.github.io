<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Wayfinder</title>
<meta name="description" content="A private, offline guide for working through a problem, from feeling stuck to a clear next move.">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101a24" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root {
  --bg: #f6f1e7; --bg2: #efe8d9; --card: #fffdf8; --ink: #1d2a39; --ink2: #4d5a68; --ink3: #6c7682;
  --line: #ddd4c2; --line2: #c9bea8; --accent: #17555f; --accent-ink: #fffdf8; --accent-soft: #dcebe8;
  --star: #b4622b; --warn-bg: #f9e9d6; --warn-line: #e3c198; --danger: #a33a2a; --danger-soft: #f8e2dd;
  --shadow: 0 1px 2px rgb(29 42 57 / 6%), 0 8px 24px rgb(29 42 57 / 5%);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, "Noto Serif", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 12px; --r2: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101a24; --bg2: #16222e; --card: #1a2835; --ink: #ece6d8; --ink2: #b7bcbd; --ink3: #939ca2;
    --line: #2b3b4a; --line2: #3c4e5e; --accent: #6fc0b8; --accent-ink: #0d1820; --accent-soft: #1f3b42;
    --star: #e5a56f; --warn-bg: #33291b; --warn-line: #5f4c2e; --danger: #f09a89; --danger-soft: #3c2320;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 20%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101a24; --bg2: #16222e; --card: #1a2835; --ink: #ece6d8; --ink2: #b7bcbd; --ink3: #939ca2;
  --line: #2b3b4a; --line2: #3c4e5e; --accent: #6fc0b8; --accent-ink: #0d1820; --accent-soft: #1f3b42;
  --star: #e5a56f; --warn-bg: #33291b; --warn-line: #5f4c2e; --danger: #f09a89; --danger-soft: #3c2320;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 20%);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol, dl, dd, blockquote, fieldset { margin: 0; padding: 0; }
ul, ol { list-style: none; }
fieldset { border: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
strong { font-weight: 650; }
small { display: block; color: var(--ink2); font-size: .88em; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1:focus-visible, main:focus-visible { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.muted { color: var(--ink3); }
.fine { color: var(--ink3); font-size: .85rem; line-height: 1.5; }
.prewrap { white-space: pre-wrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--card); }
.skip:focus { top: 8px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 9px 18px; border: 1px solid var(--line2); border-radius: 999px; background: var(--card); color: var(--ink); font: 600 .95rem/1.2 var(--sans); text-decoration: none; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--ink2); }
.btn.quiet:hover { color: var(--ink); background: var(--bg2); }
.btn.small { min-height: 38px; padding: 6px 14px; font-size: .88rem; }
.btn.big { min-height: 52px; padding: 12px 26px; font-size: 1.02rem; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--card); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link.danger { color: var(--danger); }
.iconbtn { flex: none; width: 38px; height: 38px; border: 0; border-radius: 50%; background: none; color: var(--ink3); font-size: 1.25rem; line-height: 1; cursor: pointer; }
.iconbtn:hover { background: var(--bg2); color: var(--ink); }
input.line, textarea.line, select { width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line2); border-radius: var(--r2); background: var(--card); color: var(--ink); font: inherit; }
select { width: auto; }
textarea { resize: none; overflow: hidden; display: block; }
.write { width: 100%; padding: 16px 18px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--card); color: var(--ink); font: 1.12rem/1.6 var(--serif); box-shadow: var(--shadow); transition: border-color .15s; }
.write:focus, input.line:focus, textarea.line:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); }
::placeholder { color: var(--ink3); opacity: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip input { position: absolute; opacity: 0; }
.chip span, .chip-btn { display: inline-flex; align-items: center; min-height: 38px; padding: 6px 13px; border: 1px solid var(--line2); border-radius: 999px; background: var(--card); color: var(--ink); font: 500 .88rem/1.2 var(--sans); cursor: pointer; text-align: left; }
.chip input:checked + span, .chip-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip-btn:hover, .chip span:hover { border-color: var(--accent); }

/* Public pages */
.page { max-width: 760px; margin: 0 auto; padding: 0 20px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.page > main { flex: 1; padding-bottom: 40px; }
.pagehead { padding: 22px 0; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font: 600 1.15rem var(--serif); text-decoration: none; }
.mark { width: 28px; height: 28px; color: var(--star); flex: none; }
.hero { padding: 7vh 0 40px; }
.hero.compact { padding: 4vh 0 28px; }
.hero h1 { font: 500 clamp(2.3rem, 7.5vw, 3.7rem)/1.08 var(--serif); letter-spacing: -.02em; text-wrap: balance; }
.hero.compact h1 { font-size: clamp(1.9rem, 5.5vw, 2.7rem); }
.lede { max-width: 34em; margin-top: 20px; color: var(--ink2); font-size: 1.15rem; }
.hero-do { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.sec { margin: 34px 0 12px; color: var(--ink2); font: 650 .8rem var(--sans); letter-spacing: .07em; text-transform: uppercase; }
.how ol { display: grid; gap: 0; border-top: 1px solid var(--line); margin-bottom: 18px; }
.how li { display: flex; gap: 14px; justify-content: space-between; flex-wrap: wrap; padding: 13px 0; border-bottom: 1px solid var(--line); }
.how li strong { font: 600 1.05rem var(--serif); }
.how li span { color: var(--ink2); }
.tlist { display: grid; gap: 10px; }
.tcard a { display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: inherit; text-decoration: none; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.tcard a:hover { border-color: var(--accent); transform: translateY(-1px); }
.tcard.due a { border-left: 3px solid var(--star); }
.tc-top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.tc-title { font: 600 1.1rem/1.3 var(--serif); }
.tc-note { display: block; margin-top: 5px; color: var(--ink2); font: italic .95rem/1.45 var(--serif); }
.tc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 10px; color: var(--ink3); font-size: .84rem; }
.tc-att { color: var(--star); font-weight: 600; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--line2); }
.dots i.begun { background: var(--accent-soft); border-color: var(--accent); }
.dots i.done { background: var(--accent); border-color: var(--accent); }
.pill { flex: none; padding: 2px 9px; border-radius: 999px; background: var(--bg2); color: var(--ink2); font: 600 .74rem/1.5 var(--sans); }
.pill.ready { background: var(--accent-soft); color: var(--accent); }
.pill.resolved { background: var(--accent-soft); color: var(--accent); }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding: 22px 0 28px; border-top: 1px solid var(--line); color: var(--ink3); font-size: .85rem; }
.foot nav { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.foot a { color: var(--ink2); }
.col { max-width: 660px; margin: 0 auto; }
.col.single { width: 100%; }

/* Thread shell */
.shell { display: grid; grid-template: "top top top" auto "rail main panel" 1fr / 210px minmax(0, 1fr) 290px; min-height: 100vh; min-height: 100dvh; }
.topbar { grid-area: top; position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
.tb-title { flex: 1; min-width: 0; }
.tb-t { display: block; overflow: hidden; color: var(--ink2); font: 500 .95rem var(--serif); text-overflow: ellipsis; white-space: nowrap; }
.save { color: var(--ink3); font-size: .8rem; white-space: nowrap; }
.save.fail { color: var(--danger); font-weight: 600; }
.rail { grid-area: rail; position: sticky; top: 55px; align-self: start; padding: 26px 12px 20px 18px; }
.stages { position: relative; }
.stage a { position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: var(--r2); color: var(--ink2); text-decoration: none; font-weight: 500; font-size: .95rem; }
.stage a:hover { background: var(--bg2); color: var(--ink); }
.stage:not(:last-child) a::after { content: ""; position: absolute; left: 21px; top: 38px; bottom: -11px; width: 1px; background: var(--line2); }
.node { z-index: 1; display: grid; place-items: center; flex: none; width: 27px; height: 27px; border: 1px solid var(--line2); border-radius: 50%; background: var(--bg); font-size: .78rem; font-weight: 650; }
.stage.begun .node { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.stage.done .node { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.stage.here a { color: var(--ink); font-weight: 650; }
.stage.here .node { box-shadow: 0 0 0 3px var(--bg), 0 0 0 4.5px var(--star); }
.rail-links { display: grid; gap: 2px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
.rail-links a { padding: 6px 8px; border-radius: var(--r2); color: var(--ink2); font-size: .92rem; text-decoration: none; }
.rail-links a.rail-ex { color: var(--star); font-size: .82rem; line-height: 1.3; }
.rail-links a:hover, .rail-links a.here { background: var(--bg2); color: var(--ink); }
.shell > main { grid-area: main; padding: 40px 28px 100px; min-width: 0; }
.panel { grid-area: panel; position: sticky; top: 55px; align-self: start; max-height: calc(100vh - 55px); max-height: calc(100dvh - 55px); overflow-y: auto; padding: 24px 18px; border-left: 1px solid var(--line); }
.p-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.p-head h2 { color: var(--ink2); font: 650 .8rem var(--sans); letter-spacing: .07em; text-transform: uppercase; }
.p-close { display: none; }
.p-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
.p-row h3 { font: 600 .8rem var(--sans); }
.p-row h3 a { color: var(--ink3); text-decoration: none; }
.p-row h3 a:hover { color: var(--accent); text-decoration: underline; }
.p-edit { width: 100%; margin-top: 2px; padding: 2px 4px; margin-left: -4px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--ink); font: .94rem/1.45 var(--serif); }
.p-edit:hover { border-color: var(--line); }
.p-edit:focus { border-color: var(--accent); background: var(--card); }
.p-val { margin-top: 2px; font: .94rem/1.45 var(--serif); }
.p-foot { margin-top: 10px; color: var(--ink3); font-size: .76rem; }
.summary-btn, .sheet-back { display: none; }

/* Question screens */
.eyebrow { color: var(--star); font: 650 .78rem var(--sans); letter-spacing: .06em; text-transform: uppercase; }
.ey-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 14px; }
.ey-link { color: var(--ink3); font-size: .84rem; text-underline-offset: 3px; }
.ey-link:hover { color: var(--accent); }
.q { margin: 8px 0 8px; font: 500 clamp(1.65rem, 4.2vw, 2.25rem)/1.18 var(--serif); letter-spacing: -.012em; text-wrap: balance; }
.why { max-width: 36em; margin-bottom: 20px; color: var(--ink2); }
.intro { margin-top: 16px; color: var(--ink2); }
.echo { margin: 12px 0 18px; padding: 2px 0 2px 14px; border-left: 2px solid var(--line2); color: var(--ink2); font: italic 1rem/1.5 var(--serif); }
.echo span { display: block; margin-bottom: 1px; color: var(--ink3); font: 600 .74rem var(--sans); letter-spacing: .03em; }
.echo.note { padding: 12px 16px; border-left-color: var(--star); border-radius: 0 var(--r2) var(--r2) 0; background: var(--bg2); color: var(--ink); white-space: pre-wrap; }
.prompts { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-top: 14px; color: var(--ink2); font-size: .95rem; }
.prompts ul { display: grid; gap: 3px; }
.prompts li::before { content: "✦"; margin-right: 8px; color: var(--star); font-size: .7em; vertical-align: 1px; }
.prompts .link { font-size: .85rem; white-space: nowrap; }
.help { margin-top: 14px; font-size: .92rem; }
.navrow { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.navright { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.navrow .btn.primary { margin-left: auto; }
.navright .btn.primary { margin-left: 0; }
.fieldlabel { display: block; margin: 20px 0 8px; font-weight: 600; font-size: .95rem; }
.choices { display: grid; gap: 8px; }
.choice { width: 100%; min-height: 54px; padding: 13px 18px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--card); color: var(--ink); font: 500 1rem/1.35 var(--sans); text-align: left; text-decoration: none; cursor: pointer; transition: border-color .15s, transform .1s; display: block; }
.choice:hover { border-color: var(--accent); transform: translateX(2px); }
.choice.on { border-color: var(--accent); background: var(--accent-soft); }
.choices + .fine { margin-top: 14px; }
.clarity { margin-top: 26px; font-size: .92rem; color: var(--ink2); }
.clarity p { margin-bottom: 8px; }
.notice { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 18px; padding: 13px 16px; border: 1px solid var(--warn-line); border-radius: var(--r); background: var(--warn-bg); font-size: .95rem; }
.notice.plain { display: block; }
.notice .echo { margin: 0; }
.pausept { padding-top: 7vh; }
.card { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); }
.card + .card, section.card { margin-top: 12px; }
.card h2 { font: 600 1.25rem/1.3 var(--serif); }
.card-do { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.card-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: .86rem; }
.tech h1 { margin-top: 6px; font: 500 1.65rem/1.25 var(--serif); }
.tech-name { color: var(--ink3); font-size: .9rem; }
.because { margin-top: 12px; padding: 9px 12px; border-radius: var(--r2); background: var(--accent-soft); font-size: .94rem; }
.facts { display: grid; gap: 10px; margin-top: 14px; }
dt { color: var(--ink3); font-size: .8rem; font-weight: 600; }
.caution { margin-top: 14px; padding: 10px 13px; border-left: 3px solid var(--star); background: var(--warn-bg); border-radius: 0 var(--r2) var(--r2) 0; font-size: .92rem; }
details > summary { cursor: pointer; color: var(--accent); font-size: .92rem; font-weight: 550; }
.example { margin-top: 18px; }
.example p { margin-top: 8px; font: 1rem/1.5 var(--serif); }
.example p span { display: block; color: var(--ink3); font: 650 .74rem var(--sans); }
.recap { margin: 0 0 18px; padding: 12px 16px; border-radius: var(--r2); background: var(--bg2); }
.recap dl { display: grid; gap: 9px; margin-top: 10px; }
.recap dd { font: .97rem/1.45 var(--serif); white-space: pre-wrap; }
.rows { display: grid; gap: 8px; margin-bottom: 12px; }
.wrow, .irow { display: flex; align-items: center; gap: 6px; }
.wrow select { flex: none; max-width: 170px; }
.ideaform { display: flex; gap: 8px; }
.angle { margin: 14px 0; padding: 11px 14px; border: 1px dashed var(--line2); border-radius: var(--r2); }
.angle-q { font: italic 1.04rem/1.4 var(--serif); margin: 2px 0 4px; }
.angle .link { font-size: .85rem; }
.count { color: var(--ink3); font-size: .85rem; margin-bottom: 6px; }
div.empty, p.empty { padding: 20px; border: 1px dashed var(--line2); border-radius: var(--r); color: var(--ink2); }
div.empty .btn { margin-top: 10px; }
.idea-t { margin-bottom: 8px; font: 1.06rem/1.4 var(--serif); }
.line.sub { margin-top: 8px; }
.compare { display: grid; gap: 12px; }
.compare h2 { font-size: 1.1rem; margin-bottom: 6px; }
.rate { margin-top: 12px; }
.rate p { margin-bottom: 5px; font-size: .9rem; font-weight: 600; }
.rate .muted { font-weight: 400; }
.outcomes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.outcome input { position: absolute; opacity: 0; }
.outcome span { display: block; height: 100%; padding: 12px 14px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--card); cursor: pointer; }
.outcome input:checked + span { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.outcome input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; margin-bottom: 12px; padding: 3px; border-radius: 999px; background: var(--bg2); }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; padding: 5px 12px; border-radius: 999px; color: var(--ink2); font-size: .84rem; font-weight: 600; cursor: pointer; }
.seg input:checked + span { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 12%); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }
label.sub { display: block; margin-top: 10px; }
label.sub > span { display: block; margin-bottom: 4px; font-size: .88rem; font-weight: 600; }
.more { margin-top: 12px; }
.action.closed { opacity: .82; }
.checkin { margin-top: 12px; }
.checkin .btn { margin-top: 10px; }
.stack { display: grid; gap: 10px; margin-bottom: 8px; }
.stack .sec { margin-bottom: 2px; }
.stack .card + .card { margin-top: 0; }
.whatnow { margin: 14px 0; }
.date { width: auto; min-height: 38px; padding: 4px 10px; font-size: .88rem; }
.exbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: .88rem; }
.meter { height: 3px; margin-top: 8px; border-radius: 2px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.exbar + .meter + .q, .meter + .q { margin-top: 22px; }
.timer { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.timer output { font: 500 3.3rem/1 var(--serif); font-variant-numeric: tabular-nums; }
.checks { display: grid; gap: 8px; }
.checkrow { display: flex; gap: 11px; align-items: flex-start; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--card); cursor: pointer; }
.checkrow input { flex: none; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.carry { margin-top: 22px; display: grid; gap: 8px; }
.carry legend { margin-bottom: 8px; font-weight: 600; font-size: .95rem; }
.support { border-color: var(--warn-line); background: var(--warn-bg); margin-bottom: 18px; }
.support p { margin-top: 8px; }

/* Brief */
.finish { margin-bottom: 22px; border-color: var(--accent); }
.finish .fieldlabel { margin-top: 14px; }
.finish .link { margin-top: 14px; font-size: .88rem; }
.b-head { margin-bottom: 16px; }
.b-head h1 { margin: 0; }
.b-title { width: 100%; margin-top: 6px; padding: 0; border: 0; background: none; color: var(--ink); font: 500 clamp(1.7rem, 4.2vw, 2.2rem)/1.2 var(--serif); letter-spacing: -.012em; }
.b-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 8px; color: var(--ink3); font-size: .85rem; }
.b-meta select { min-height: 32px; padding: 2px 6px; font-size: .85rem; }
.tabs { display: flex; gap: 18px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 8px 2px; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--ink2); font-weight: 600; font-size: .94rem; text-decoration: none; }
.tabs a.on { border-color: var(--accent); color: var(--ink); }
.b-sec { padding: 22px 0 16px; border-bottom: 1px solid var(--line); }
.b-sec h2 { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; font: 600 1.25rem var(--serif); }
.b-sec h2 span { color: var(--star); font-size: .95rem; }
.b-row { margin-top: 12px; }
.b-row > label { display: block; color: var(--ink3); font-size: .8rem; font-weight: 600; }
.b-row li { margin-top: 3px; padding-left: 14px; position: relative; font: 1.03rem/1.5 var(--serif); }
.b-row li::before { content: "·"; position: absolute; left: 3px; color: var(--ink3); }
.b-row li.dropped { color: var(--ink3); }
.b-row p { font: 1.03rem/1.5 var(--serif); }
.b-edit { width: 100%; margin: 1px 0 0 -6px; padding: 3px 6px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--ink); font: 1.03rem/1.5 var(--serif); }
.b-edit:hover { border-color: var(--line); }
.b-edit:focus { border-color: var(--accent); background: var(--card); }
.b-edit.strong { font-weight: 600; }
.b-actions { display: grid; gap: 10px; }
.b-action { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--card); }
.b-action dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; margin-top: 6px; }
.b-action dd { font-size: .92rem; }
.b-dl { display: grid; gap: 8px; margin-top: 6px; }
.b-dl dd { font: 1rem/1.5 var(--serif); }
.export { margin-top: 12px; }
.danger-row { margin-top: 26px; font-size: .88rem; }
.lib { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px; }
.lib a { display: block; height: 100%; padding: 13px 15px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: inherit; text-decoration: none; }
.lib a:hover { border-color: var(--accent); }
.lib strong { display: block; font: 600 1.05rem var(--serif); }
.lib span { color: var(--ink2); font-size: .9rem; line-height: 1.4; display: block; }
ul.plain li { margin-top: 6px; padding-left: 16px; position: relative; font-size: .95rem; }
ul.plain li::before { content: "·"; position: absolute; left: 4px; }
.card > p { margin-top: 6px; }
.danger-card { border-color: var(--danger-soft); }
.danger-card .btn { margin-top: 12px; }
.stats { max-height: 220px; overflow: auto; padding: 10px; border-radius: 6px; background: var(--bg2); font-size: .78rem; }
.prose h2 { margin: 26px 0 6px; font: 600 1.25rem var(--serif); }
.prose p { margin-bottom: 10px; }
.prose ul { list-style: disc; padding-left: 20px; margin-bottom: 10px; }
.prose .card { margin: 16px 0; }

/* Floating */
#toast { position: fixed; left: 50%; bottom: 74px; z-index: 60; display: flex; gap: 14px; align-items: center; max-width: calc(100vw - 32px); padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: .92rem; transform: translate(-50%, 14px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
#toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast .link { color: inherit; font-weight: 650; }
#savefail, #updatebar { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 55; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; max-width: 560px; margin: 0 auto; padding: 12px 16px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); font-size: .92rem; }
#savefail { border-color: var(--danger); }
dialog { max-width: min(460px, calc(100vw - 32px)); padding: 22px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--card); color: var(--ink); box-shadow: 0 16px 50px rgb(0 0 0 / 30%); }
dialog::backdrop { background: rgb(10 18 26 / 45%); }
dialog h2 { margin-bottom: 8px; font: 600 1.3rem var(--serif); }
dialog input { margin-top: 12px; }
.pickthread { display: grid; gap: 8px; }
#print { display: none; }

/* Narrower laptops: the summary folds into a sheet */
/* A stage on one page */
.ov-row { margin-top: 24px; }
.ov-row label, .ov-row h2 { display: block; font: 600 1.08rem/1.35 var(--serif); }
.ov-row .fine { margin: 3px 0 8px; }
.write.ov { padding: 12px 14px; font-size: 1rem; }
.ov-list { margin: 6px 0 0; padding-left: 1.2em; list-style: disc; color: var(--ink2); }
.ov-open { display: inline-block; margin-top: 6px; font-size: .9rem; }
.stage-mark { margin-top: 26px; }
label.stage-mark small { display: block; color: var(--ink3); font-size: .84rem; }
.pausept .stage-mark { margin-top: 18px; }

/* Home search, and a technique's steps at a glance */
.search { margin-top: 26px; }
.search .fine:not(:empty) { margin-top: 10px; }
.tech-steps { margin-top: 8px; padding-left: 1.4em; list-style: decimal; }
.tech-steps li { margin-top: 8px; font: 1rem/1.45 var(--serif); }
.tech-steps small { display: block; color: var(--ink3); font: .85rem/1.45 var(--sans); }

@media (max-width: 1120px) {
  .shell { grid-template: "top top" auto "rail main" 1fr / 190px minmax(0, 1fr); }
  .summary-btn { display: block; position: fixed; right: 16px; bottom: 16px; z-index: 25; min-height: 44px; padding: 8px 16px; border: 1px solid var(--line2); border-radius: 999px; background: var(--card); color: var(--ink); font: 600 .88rem var(--sans); box-shadow: var(--shadow); cursor: pointer; }
  .panel { position: fixed; top: auto; right: 0; bottom: 0; left: 0; z-index: 40; max-width: 560px; max-height: 76vh; max-height: 76dvh; margin: 0 auto; border: 1px solid var(--line2); border-bottom: 0; border-radius: 16px 16px 0 0; background: var(--bg); box-shadow: 0 -10px 40px rgb(0 0 0 / 20%); transform: translateY(105%); visibility: hidden; transition: transform .22s ease, visibility .22s; }
  .panel.open { transform: none; visibility: visible; transition: transform .22s ease; }
  .p-close { display: block; }
  .sheet-back.on { display: block; position: fixed; inset: 0; z-index: 30; background: rgb(10 18 26 / 40%); }
}

/* Phones: stages become a compact bar across the top */
@media (max-width: 720px) {
  body { font-size: 16px; }
  .shell { grid-template: "top" auto "rail" auto "main" 1fr / minmax(0, 1fr); }
  .topbar { padding: 7px 12px; gap: 8px; }
  .save { display: none; }
  .save.fail { display: block; }
  .rail { position: sticky; top: 53px; z-index: 15; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .stages { display: flex; justify-content: space-between; align-items: center; gap: 2px; }
  .stage { flex: 0 0 auto; }
  .stage.here { flex: 1 1 auto; min-width: 0; }
  .stage a { gap: 7px; padding: 3px; }
  .stage:not(:last-child) a::after { display: none; }
  .stage-name { display: none; }
  .stage.here .stage-name { display: block; overflow: hidden; font-size: .9rem; text-overflow: ellipsis; white-space: nowrap; }
  .rail-links { display: none; }
  .shell > main { padding: 24px 16px 90px; }
  .write { padding: 14px; font-size: 1.05rem; }
  .wrow { flex-wrap: wrap; }
  .wrow input { flex: 1 1 70%; }
  .wrow select { order: 3; max-width: none; flex: 1 1 100%; }
  .navrow .btn { flex: 0 1 auto; }
  .seg { display: flex; flex-wrap: nowrap; border-radius: 12px; }
  .seg label { flex: 1 1 auto; text-align: center; }
  .seg span { padding: 5px 6px; font-size: .78rem; border-radius: 10px; }
  #toast { bottom: 70px; border-radius: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

@media print {
  :root { --bg: #fff; --ink: #000; color-scheme: light; }
  body { background: #fff; color: #000; font: 11pt/1.45 Georgia, serif; }
  #app, #toast, #savefail, #updatebar, dialog { display: none !important; }
  #print { display: block; }
  #print h1 { font-size: 21pt; font-weight: 500; line-height: 1.2; margin: 2pt 0 4pt; }
  #print .p-kicker { font: 600 8.5pt system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #555; }
  #print .p-meta { color: #555; font-size: 9pt; margin-bottom: 12pt; }
  #print h2 { font-size: 13pt; font-weight: 600; margin-top: 16pt; padding-top: 7pt; border-top: 1px solid #bbb; break-after: avoid; }
  #print h3, #print dt { font: 600 8.5pt system-ui, sans-serif; color: #555; margin-top: 7pt; break-after: avoid; }
  #print p, #print dd { white-space: pre-wrap; orphans: 3; widows: 3; }
  #print ul { list-style: disc; padding-left: 16pt; }
  #print table { width: 100%; border-collapse: collapse; margin-top: 6pt; font-size: 9pt; }
  #print th, #print td { border: 1px solid #bbb; padding: 3pt 5pt; text-align: left; vertical-align: top; }
  #print tr { break-inside: avoid; }
  @page { margin: 18mm; }
}
</style>
</head>
<body>
<button class="skip btn small" data-do="skip">Skip to content</button>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
<noscript><p style="padding:24px">Wayfinder runs entirely in your browser and needs JavaScript. Nothing you write leaves this device.</p></noscript>
<script>/* Wayfinder content: stages, question flow, routing rules and the fourteen techniques.
   Everything the guide says lives here, so wording can change without touching logic.
   IDs are stable because saved threads refer to them. */
(function () {
  const WF = (globalThis.WF = globalThis.WF || {});

  WF.STAGES = [
    { id: 'diagnose', n: 1, name: 'Diagnose', q: 'Why does it feel bad?', blurb: "Work out what's actually wrong." },
    { id: 'clarify', n: 2, name: 'Clarify', q: 'What do you want to achieve?', blurb: 'Separate what you want from how you first thought of getting it.' },
    { id: 'explore', n: 3, name: 'Explore', q: 'What are the alternatives?', blurb: 'Widen the options before judging any of them.' },
    { id: 'leverage', n: 4, name: 'Find leverage', q: 'What would make the biggest difference?', blurb: 'Avoid spending effort on the wrong thing.' },
    { id: 'act', n: 5, name: 'Act', q: 'What is the next meaningful move?', blurb: 'Turn the thinking into something you can try.' }
  ];

  WF.STATUS = { active: 'In progress', ready: 'Ready to act', parked: 'Parked', resolved: 'Resolved' };

  WF.ENTRY = [
    { id: 'off', label: "Something's off, but I can't say exactly what", to: 'd.wrong' },
    { id: 'stuck', label: "Something's stuck, or I keep avoiding it", to: 'd.wrong' },
    { id: 'torn', label: "I'm torn over a decision", to: 'c.resolved' },
    { id: 'how', label: 'I know what I want, not how to get there', to: 'x.ideas' },
    { id: 'plan', label: "I have a plan, but it doesn't happen", to: 'a.outcome' }
  ];

  WF.OUTCOMES = [
    { id: 'go', label: 'Go ahead', note: 'I know what I want to do.' },
    { id: 'test', label: 'Test it first', note: "I'll try a small version and see." },
    { id: 'learn', label: 'Find out more', note: 'I need information before deciding.' },
    { id: 'defer', label: 'Not now', note: "It's a considered decision to wait.", noAction: true },
    { id: 'drop', label: 'Let it go', note: "I've decided this isn't worth pursuing.", noAction: true },
    { id: 'open', label: 'Still undecided', note: "That's allowed. Write down what's unresolved.", noAction: true }
  ];

  WF.ACTION_TYPES = {
    action: { label: 'Action', sub: 'Something you will do', main: 'What exactly will you do?', done: "How will you know it's done?", evidence: 'What will this tell you?' },
    experiment: { label: 'Experiment', sub: 'Something you will try, to learn from', main: 'What will you try?', done: 'What will count as having tried it?', evidence: 'What do you hope to learn?' },
    decision: { label: 'Decision', sub: 'Something you have resolved', main: 'What have you resolved?', done: 'What would reopen this decision?', evidence: 'What does this free you from?' },
    research: { label: 'Research', sub: 'Something you need to find out', main: 'What do you need to find out?', done: 'What would count as enough to decide?', evidence: 'Which decision does this feed?' }
  };

  WF.CHECKIN = {
    done: { label: 'Did it', q: 'What happened? What did you learn?' },
    partly: { label: 'Partly', q: 'What got done, and what got in the way?' },
    notdone: { label: "Didn't happen", q: 'What got in the way? That is useful to know.' },
    dropped: { label: 'No longer relevant', q: 'What changed?' }
  };

  WF.WANT_KINDS = { idea: 'An idea for how', goal: 'Underlying goal', value: 'A value' };

  WF.RATINGS = [
    { id: 'impact', name: 'Impact', q: 'How much could this improve things?', scale: ['A little', 'Noticeably', 'A lot'] },
    { id: 'tract', name: 'Tractability', q: 'Can you realistically do something about it?', scale: ['Hard to move', 'Partly', 'Yes'] },
    { id: 'conf', name: 'Confidence', q: 'How much evidence supports this?', scale: ['A hunch', 'Some', 'Solid'] },
    { id: 'cost', name: 'Cost', q: 'What would it take in time, money or energy?', scale: ['Light', 'Moderate', 'Heavy'] },
    { id: 'rev', name: 'Reversibility', q: 'Can you test it without committing for good?', scale: ['Easily', 'With effort', 'Not really'] }
  ];

  WF.ANGLES = [
    { name: 'Change the constraints', prompts: ['What if you had two months instead of two years?', "What if money weren't a constraint?", 'What if you had to do this without hiring anyone?'] },
    { name: 'Reverse the problem', prompts: ['What would guarantee failure?', 'What could you stop doing?', 'What if you pursued the opposite approach?'] },
    { name: 'Change the scale', prompts: ["What's the smallest possible version?", "What's the most ambitious version?", 'What would this look like if done in one day?'] },
    { name: 'Borrow from elsewhere', prompts: ['How would someone from a different profession approach this?', 'What would you suggest if a friend brought you this?', 'What could you borrow from an unrelated field?'] },
    { name: 'Challenge assumptions', prompts: ["What if the current constraint wasn't actually necessary?", "What if you didn't have to do this yourself?", 'What if the goal could be reached another way?'] }
  ];

  /* The question flow. Each screen is one principal question. */
  WF.FLOW = {
    diagnose: [
      { id: 'd.open', type: 'text', field: 'd.open', q: "What's been on your mind?", why: "Write it however it comes. It doesn't need to be a clear problem yet.", prompts: ['What has been frustrating you lately?', 'What do you keep thinking about?', 'What have you been putting off?', 'What feels unresolved?', 'What would you most like to understand?'] },
      { id: 'd.entry', type: 'entry', q: 'Where are you with this?', why: "This just decides where to start. Every stage stays open, whichever you pick." },
      { id: 'd.wrong', type: 'text', field: 'd.wrong', quote: 'd.open', q: 'What specifically feels wrong about it?', why: 'Vague problems tend to get vague solutions. Try to get closer to what is actually bothering you.', prompts: ['Is something missing?', 'Is something happening too often?', 'Is something harder than it should be?', 'Is there something you wish were different?', "Is there something you're afraid might happen?", "Is there something you feel you ought to want, but don't?"] },
      { id: 'd.route', type: 'route', route: 'diagnose' },
      { id: 'd.matters', type: 'text', field: 'd.matters', q: 'Why does this matter to you?', why: 'What it would cost to leave this as it is often says more than the problem itself.', prompts: ['What happens if nothing changes?', 'Who else does this affect?', 'What does it stop you doing?'] },
      { id: 'd.unsure', type: 'text', field: 'd.unsure', q: 'What are you still unsure about?', why: "You don't have to resolve this now. Naming it is enough, and it stays in your brief.", prompts: ["What are you assuming that you haven't checked?", "What might you be wrong about?"] },
      { id: 'd.sum', type: 'sum', field: 'd.sum', recap: ['d.open', 'd.wrong', 'd.feel', 'd.matters', 'd.unsure'], q: 'So what appears to be wrong?', why: 'A sentence or two in your own words. You can change it whenever you learn more.', placeholder: 'The problem, as I see it now, is…' },
      { id: 'd.break', type: 'break' }
    ],
    clarify: [
      { id: 'c.resolved', type: 'text', field: 'c.resolved', quote: 'd.sum', q: 'Imagine this were resolved. What would be different?', why: 'Picturing the outcome tends to show what you want from it, separately from any one way of getting there.', prompts: ['What would you gain?', "What could you do that you can't now?", 'What would become easier?', 'What matters most about that outcome?', 'Is there something else you are trying to achieve through this?'] },
      { id: 'c.sort', type: 'wants', q: 'What are you actually after?', why: "List what you want, then say what kind of thing each one is. An idea like \"start a business\" can be carrying several separate goals, and they needn't be equally important." },
      { id: 'c.route', type: 'route', route: 'clarify' },
      { id: 'c.success', type: 'text', field: 'c.success', q: 'What would a good outcome look like?', why: 'Good enough to recognise. It need not be perfect.', prompts: ['How would you know it had worked?', 'What would "good enough" be?'] },
      { id: 'c.limits', type: 'text', field: 'c.limits', q: "What constraints matter, and what won't you sacrifice?", why: 'These rule options out honestly, before you get attached to them.', prompts: ['What can you not change?', 'What are you unwilling to give up?', 'What trade-offs would you accept?'] },
      { id: 'c.sum', type: 'sum', field: 'c.sum', recapWants: true, recap: ['c.resolved', 'c.success', 'c.limits'], q: 'So what do you really want here?', why: 'A sentence or two. It should be possible to get there by more than one route.', placeholder: "What I'm really after is…" },
      { id: 'c.break', type: 'break' }
    ],
    explore: [
      { id: 'x.ideas', type: 'ideas', quote: 'c.sum', q: 'What are all the possible ways you could approach this?', why: 'Quantity first. Silly ones count. Judging comes later, in the next stage.' },
      { id: 'x.route', type: 'route', route: 'explore' },
      { id: 'x.assume', type: 'text', field: 'x.assume', q: 'Which assumptions have you been making?', why: 'A constraint you assumed can hide a whole group of options.', prompts: ['What have you treated as fixed that might not be?', 'What have you been told that you never tested?'] },
      { id: 'x.questions', type: 'text', field: 'x.questions', q: 'What would you need to find out?', why: "Open questions are useful output. They often become your first experiment.", prompts: ['What would change which option you favour?', 'Who would know?'] },
      { id: 'x.break', type: 'break' }
    ],
    leverage: [
      { id: 'l.shortlist', type: 'shortlist', q: 'Which of these seem most promising?', why: 'Now you can judge. Mark the ones worth a closer look. If you drop one, a few words on why helps your future self.' },
      { id: 'l.bottleneck', type: 'text', field: 'l.bottleneck', q: 'What is currently limiting progress?', why: "Find the bottleneck. A writer who drafts quickly but lacks ideas won't gain much from drafting faster.", prompts: ['If this one thing improved, what else would move?', "What's the slowest step?"] },
      { id: 'l.several', type: 'text', field: 'l.several', q: 'What would help several things at once?', why: 'Some changes improve many things together. A better place to work can lift concentration, energy and consistency.', prompts: ['What keeps showing up in different problems?', 'What makes other improvements easier?'] },
      { id: 'l.cost', type: 'text', field: 'l.cost', q: 'What would you be giving up?', why: 'Choosing one thing takes time and attention from others. That cost is real even though it is invisible.', prompts: ['What else could this time go to?', 'Which option closes off the most?'] },
      { id: 'l.route', type: 'route', route: 'leverage' },
      { id: 'l.compare', type: 'compare', q: 'How do the strongest options compare?', why: "This is for your judgement, so there's no score. Use it to notice what you think." },
      { id: 'l.pick', type: 'sum', field: 'l.pick', recap: ['l.bottleneck', 'l.several', 'l.cost'], pickFromIdeas: true, q: 'What would make the biggest difference?', why: 'One thing, for now. You can come back and change it.', placeholder: 'The change that would matter most is…' },
      { id: 'l.why', type: 'text', field: 'l.why', q: 'Why does this seem right, and what are you assuming?', why: 'Assumptions written down can be tested. The ones left unwritten tend to go unnoticed.', prompts: ['What would have to be true for this to work?', "What's the weakest part of this reasoning?"] },
      { id: 'l.break', type: 'break' }
    ],
    act: [
      { id: 'a.outcome', type: 'outcome', quote: 'l.pick', q: 'Where have you landed?', why: "Waiting, dropping it and staying undecided are all real outcomes, so long as you've thought them through." },
      { id: 'a.why', type: 'text', field: 'a.why', q: 'Why does this seem like the right call?', why: 'Reasons are what you will want to re-read in a month.', prompts: ['What tipped it?', 'What are you trading away?'] },
      { id: 'a.change', type: 'text', field: 'a.change', q: 'What might change your mind?', why: 'Decide now what would count as evidence, while you are not invested in the result.', prompts: ['What result would make you stop?', 'What are you still unsure of?'] },
      { id: 'a.route', type: 'route', route: 'act' },
      { id: 'a.actions', type: 'actions', q: "What's the smallest meaningful thing you could do next?", why: 'Specific, in your control, small enough to actually attempt, and clear about what done looks like.' },
      { id: 'a.review', type: 'review', q: 'When should you look at this again?', why: 'Wayfinder will not interrupt you. Pick a date and it will be waiting here for you.' }
    ]
  };

  /* Which technique is suggested for which stated difficulty. The rules are the whole
     mechanism: routing depends only on the option chosen, never on what the user wrote. */
  WF.ROUTES = {
    diagnose: {
      q: "What's closest to your situation?",
      options: [
        { id: 'vague', label: "I know something feels wrong, but I can't explain it", tech: 'focusing', because: "You said something feels wrong but you can't explain it." },
        { id: 'avoid', label: 'I know what I need to do, but I keep avoiding it', tech: 'aversion', because: 'You said you keep avoiding something you know you need to do.' },
        { id: 'worry', label: "I'm worried about how something will turn out", tech: 'simulator', because: "You said you're worried about how something will turn out." },
        { id: 'split', label: 'Part of me wants one thing, and part of me wants another', tech: 'idc', because: 'You said part of you wants one thing and part of you wants another.' },
        { id: 'person', label: "This is really a disagreement with someone", tech: 'doublecrux', because: "You said this is really a disagreement with someone." },
        { id: 'clear', label: 'I can already explain the problem clearly', tech: null }
      ],
      alternates: ['focusing', 'aversion', 'simulator', 'idc', 'doublecrux']
    },
    clarify: {
      q: "What's closest to your situation?",
      options: [
        { id: 'attached', label: "I'm attached to one particular solution", tech: 'goalfactor', because: "You said you're attached to one particular solution." },
        { id: 'many', label: "I have several priorities and don't know what matters most", tech: 'hamming', because: "You said you have several priorities and aren't sure what matters most." },
        { id: 'torn', label: "I'm pulled in two directions", tech: 'idc', because: "You said you're pulled in two directions." },
        { id: 'clear', label: 'I already know what matters and why', tech: null }

      act: !!t.outcome && (t.actions.some((a) => has(a.text)) || WF.OUTCOMES.some((o) => o.id === t.outcome && o.noAction))
    }[stage];
  }

  function stageState(t, stage) {
    if (stageFilled(t, stage) || t.stageMarked[stage]) return 'done';
    return stageHasContent(t, stage) ? 'begun' : 'empty';
  }

  /* Search looks through everything the thread holds, on this device only. */
  function matchesSearch(t, query) {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    const text = [t.title, t.nextNote, ...Object.values(t.a), ...t.wants.map((w) => w.text), ...t.ideas.map((i) => i.text), ...t.actions.map((a) => a.text)];
    return text.some((x) => String(x || '').toLowerCase().includes(q));
  }

  const stageOfScreen = (id) => STAGE_IDS.find((s) => WF.FLOW[s].some((x) => x.id === id)) || 'diagnose';
  const screenById = (id) => WF.FLOW[stageOfScreen(id)].find((x) => x.id === id);

  function nextScreen(id) {
    const stage = stageOfScreen(id);
    const flow = WF.FLOW[stage];
    const i = flow.findIndex((x) => x.id === id);
    if (i < flow.length - 1) return flow[i + 1].id;
    const s = STAGE_IDS.indexOf(stage);
    return s < STAGE_IDS.length - 1 ? WF.FLOW[STAGE_IDS[s + 1]][0].id : null;
  }

  function prevScreen(id) {
    const stage = stageOfScreen(id);
    const flow = WF.FLOW[stage].filter((x) => x.type !== 'break');
    const i = flow.findIndex((x) => x.id === id);
    if (i > 0) return flow[i - 1].id;
    const s = STAGE_IDS.indexOf(stage);
    if (s === 0) return null;
    const prev = WF.FLOW[STAGE_IDS[s - 1]].filter((x) => x.type !== 'break');
    return prev[prev.length - 1].id;
  }

  /* A stage goes stale when an earlier conclusion changed after that stage was written. */
  function staleSince(t, stage) {
    const i = STAGE_IDS.indexOf(stage);
    if (i < 1 || !stageHasContent(t, stage)) return null;
    const mine = Math.max(t.stageAt[stage] || 0, t.ack[stage] || 0);
    if (!mine) return null;
    const labels = { 'd.sum': 'what you said was wrong', 'c.sum': 'what you said you want', 'l.pick': 'your leverage point' };
    for (const f of KEY_FIELDS) {
      if (STAGE_IDS.indexOf(STAGE_PREFIX[f[0]]) >= i) continue;
      if ((t.keyAt[f] || 0) > mine) return { field: f, label: labels[f], at: t.keyAt[f], screen: f };
    }
    return null;
  }

  /* Elaborating without moving. The rule is deliberately simple and is shown to the user:
     meaning can't be judged here, so only sittings and actions are counted. */
  function overthinking(t, stage) {
    if (stage === 'act' || t.nudgeOff[stage] || t.actions.length) return null;
    const n = (t.stageTouch[stage] || []).length;
    return n >= OVERTHINK_SITTINGS ? n : null;
  }

  function supportNeeded(t, text) {
    return !t.supportShown && has(text) && WF.SUPPORT_PATTERN.test(text);
  }

  /* -- Home ------------------------------------------------------------------------- */

  const todayIso = () => {
    const d = new Date(now());
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };

  /* Why a thread is asking for attention, if it is. Drives both ordering and the card label. */
  function attention(t) {
    if (t.returnOn && t.returnOn <= todayIso() && t.status !== 'resolved') return 'due';
    if (t.status === 'active' || t.status === 'ready') {
      if (openActions(t).length) return 'waiting';
      if (waitingExercises(t).length) return 'waiting';
    }
    return '';
  }

  function sortForHome(threads) {
    const rank = (t) => ({ due: 0, waiting: 1 }[attention(t)] ?? 2);
    return [...threads].sort((a, b) => rank(a) - rank(b) || b.updatedAt - a.updatedAt);
  }

  function summary(t) {
    const promising = t.ideas.filter((i) => i.mark === 'promising' && has(i.text));
    return {
      problem: t.a['d.sum'] || '',
      want: t.a['c.sum'] || '',
      ideas: t.ideas.filter((i) => has(i.text)).length,

      leverage: t.a['l.pick'] || '',

    };
  }

  /* -- Exercises -------------------------------------------------------------------- */

  function startExercise(t, tech, stage, returnTo, because) {
    const ex = { id: uid(), tech, stage, status: 'active', step: 0, answers: {}, debrief: '', returnTo: returnTo || '', because: because || '', startedAt: now(), updatedAt: now() };
    t.exercises.push(ex);
    return ex;
  }

  function carryOptions(ex) {
    const tech = WF.TECHNIQUES[ex.tech];
    return (tech.carry ? tech.carry(ex.answers) : []).filter((c) => has(c.text) && !(c.onlyBefore && has(ex.answers[c.onlyBefore]))).map((c, i) => ({ ...c, key: String(i) }));
  }

  function applyCarry(t, c) {
    const to = c.to;
    if (to.kind === 'field') {
      const prev = t.a[to.field] || '';
      if (prev.includes(c.text)) return;
      t.a[to.field] = prev ? `${prev}\n${c.text}` : c.text;
    } else if (to.kind === 'idea') {
      if (!t.ideas.some((i) => i.text === c.text)) t.ideas.push(normalize({ ideas: [{ text: c.text }] }).ideas[0]);
    } else if (to.kind === 'want') {
      if (!t.wants.some((w) => w.text === c.text)) t.wants.push({ id: uid(), text: c.text, kind: to.want });
    } else if (to.kind === 'action') {
      t.actions.push(normalizeAction({ type: to.type, text: c.text, ...(to.patch || {}) }));
    } else if (to.kind === 'patch') {
      const x = t.actions.find((a) => a.id === to.id);
      if (x) for (const [k, v] of Object.entries(to.patch)) if (has(v)) x[k] = has(x[k]) && !x[k].includes(v) ? `${x[k]}; ${v}` : v;
    }
    t.updatedAt = now();
  }

  /* -- Example ---------------------------------------------------------------------- */

  function exampleThread() {
    const e = WF.EXAMPLE;
    const t = normalize({ title: e.title, example: true, outcome: e.outcome, a: e.a, wants: e.wants, ideas: e.ideas, actions: e.actions, status: 'ready', cursor: 'a.review', entry: 'off' });
    t.sittings = [{ id: uid(), start: now(), last: now(), edits: 1 }];
    return t;
  }

  /* -- Backups and multi-device merge ----------------------------------------------- */

  const SUM = (vv) => Object.values(vv || {}).reduce((a, b) => a + b, 0);

  /* Version vectors tell a strict ancestor apart from two copies that each moved on. */
  function compareVV(a, b) {
    let aAhead = false;
    let bAhead = false;
    for (const k of new Set([...Object.keys(a || {}), ...Object.keys(b || {})])) {
      if ((a[k] || 0) > (b[k] || 0)) aAhead = true;
      if ((b[k] || 0) > (a[k] || 0)) bAhead = true;
    }
    if (aAhead && bAhead) return 'diverged';
    if (aAhead) return 'ahead';
    if (bAhead) return 'behind';
    return 'same';
  }

  function makeBackup(threads, kind) {
    return { app: 'wayfinder', kind: kind || 'backup', schema: SCHEMA, exportedAt: new Date(now()).toISOString(), threads };
  }

  function parseBackup(text) {
    let data;
    try { data = JSON.parse(text); } catch { throw new Error("This file isn't valid JSON."); }
    if (!data || data.app !== 'wayfinder' || !Array.isArray(data.threads)) throw new Error("This doesn't look like a Wayfinder backup.");
    if (typeof data.schema !== 'number' || data.schema > SCHEMA) throw new Error('This backup came from a newer version of Wayfinder. Update the app, then try again.');
    return migrate(data).threads.map(normalize);
  }

  /* Each schema change adds a step here, so old backups always remain readable. */
  function migrate(data) {
    return data;
  }

  /* Works out what importing would do, without doing it. */
  function planImport(incoming, existing) {
    const byId = new Map(existing.map((t) => [t.id, t]));
    return incoming.map((t) => {
      const mine = byId.get(t.id);
      if (!mine) return { thread: t, action: 'add' };
      const c = compareVV(t.vv, mine.vv);
      if (c === 'same') return { thread: t, action: 'skip' };
      if (c === 'ahead') return { thread: t, action: 'replace' };
      if (c === 'behind') return { thread: t, action: 'skip' };
      return { thread: t, action: 'copy' };
    });
  }

  function asCopy(t) {
    return { ...t, id: uid(), title: `${t.title} (other device's copy)`, vv: { ...t.vv } };
  }

  function anonymousStats(threads) {
    const real = threads.filter((t) => !t.example);
    return {
      threads: real.length,
      perThread: real.map((t) => ({
        sittings: sittingCount(t),
        daysSpanned: Math.round((t.updatedAt - t.createdAt) / DAY),
        stages: STAGE_IDS.map((s) => stageState(t, s)),
        ideas: t.ideas.length,
        exercisesStarted: t.exercises.map((e) => e.tech),
        exercisesFinished: t.exercises.filter((e) => e.status === 'done').length,
        actions: t.actions.length,
        actionsCheckedIn: t.actions.filter((a) => a.state !== 'open').length,
        outcome: t.outcome || null,
        clarity: [t.clarityStart || null, t.clarityEnd || null],
        status: t.status
      }))
    };
  }

  WF.model = {
    SCHEMA, DAY, SITTING_GAP, LONG_GAP, STAGE_IDS, KEY_FIELDS,
    now, uid, has, deriveTitle, newThread, normalize, normalizeAction, getPath, setPath, stageOfPath,
    recordEdit, bump, sitting, isReturning, startSitting, pause, sittingCount, isLongGap, logCheckin, closeAction,
    openActions, waitingExercises, activeExercises, stageHasContent, stageFilled, stageState, matchesSearch, stageOfScreen, screenById,
    nextScreen, prevScreen, staleSince, overthinking, supportNeeded, todayIso, attention, sortForHome, summary,
    startExercise, carryOptions, applyCarry, exampleThread, compareVV, makeBackup, parseBackup, planImport, asCopy,
    anonymousStats, SUM
  };
})();

/* Wayfinder storage: IndexedDB, falling back to localStorage, then to memory with a warning.
   Nothing here touches the network. */
(function () {
  const WF = (globalThis.WF = globalThis.WF || {});
  const DB_NAME = 'wayfinder';
  const LS_KEY = 'wayfinder.v1';
  let db = null;
  let mode = 'memory';
  const memory = { threads: new Map(), meta: new Map() };

  const req = (r) => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });

  function openDb() {
    return new Promise((ok, no) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => {
        r.result.createObjectStore('threads', { keyPath: 'id' });
        r.result.createObjectStore('meta', { keyPath: 'k' });
      };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => no(r.error);
      r.onblocked = () => no(new Error('blocked'));
    });
  }

  function lsLoad() {
    const raw = JSON.parse(localStorage.getItem(LS_KEY) || '{"threads":[],"meta":[]}');
    memory.threads = new Map(raw.threads.map((t) => [t.id, t]));
    memory.meta = new Map(raw.meta);
  }

  function lsSave() {
    localStorage.setItem(LS_KEY, JSON.stringify({ threads: [...memory.threads.values()], meta: [...memory.meta] }));
  }

  async function init() {
    try {
      db = await openDb();
      db.onversionchange = () => db.close();
      mode = 'indexeddb';
      return mode;
    } catch { /* Private windows and some embedded browsers refuse IndexedDB. */ }
    try {
      lsLoad();
      mode = 'localstorage';
    } catch { mode = 'memory'; }
    return mode;
  }

  const tx = (store, m) => db.transaction(store, m).objectStore(store);

  async function all() {
    if (mode === 'indexeddb') return req(tx('threads', 'readonly').getAll());
    return [...memory.threads.values()];
  }

  async function get(id) {
    if (mode === 'indexeddb') return req(tx('threads', 'readonly').get(id));
    return memory.threads.get(id);
  }

  async function put(thread) {
    if (mode === 'indexeddb') return req(tx('threads', 'readwrite').put(JSON.parse(JSON.stringify(thread))));
    memory.threads.set(thread.id, JSON.parse(JSON.stringify(thread)));
    if (mode === 'localstorage') lsSave();
  }

  async function del(id) {
    if (mode === 'indexeddb') return req(tx('threads', 'readwrite').delete(id));
    memory.threads.delete(id);
    if (mode === 'localstorage') lsSave();
  }

  async function getMeta(k, fallback) {
    if (mode === 'indexeddb') {
      const row = await req(tx('meta', 'readonly').get(k));
      return row ? row.v : fallback;
    }
    return memory.meta.has(k) ? memory.meta.get(k) : fallback;
  }

  async function setMeta(k, v) {
    if (mode === 'indexeddb') return req(tx('meta', 'readwrite').put({ k, v }));
    memory.meta.set(k, v);
    if (mode === 'localstorage') lsSave();
  }

  async function clearAll() {
    if (mode === 'indexeddb') {
      await req(tx('threads', 'readwrite').clear());
      const keep = await getMeta('device');
      await req(tx('meta', 'readwrite').clear());
      if (keep) await setMeta('device', keep);
      return;
    }
    memory.threads.clear();
    memory.meta.clear();
    if (mode === 'localstorage') lsSave();
  }

  /* Asks the browser not to evict this data under storage pressure. */
  async function persist() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        if (await navigator.storage.persisted()) return true;
        return await navigator.storage.persist();
      }
    } catch { /* Unavailable on some origins, including file:. */ }
    return false;
  }

  async function estimate() {
    try {
      if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate();
    } catch { /* Fall through. */ }
    return null;
  }

  WF.store = { init, all, get, put, del, getMeta, setMeta, clearAll, persist, estimate, mode: () => mode };
})();

/* The Thinking Brief: a view over the thread, never a separate copy of it.
   Rows name the same paths the stages edit, so changing text anywhere changes it everywhere.
   Nothing here invents or summarises: every word comes from the user. */
(function () {
  const WF = (globalThis.WF = globalThis.WF || {});
  const M = WF.model;

  const fdate = (ms) => new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const f = (key, core) => ({ kind: 'field', path: `a/${key}`, key, label: WF.FIELD_LABELS[key], core: !!core });

  function sections() {
    return [
      { n: 1, title: 'The problem', stage: 'diagnose', screen: 'd.sum', rows: [f('d.open', true), f('d.wrong'), f('d.feel'), f('d.matters'), f('d.sum', true), f('d.unsure', true)] },
      { n: 2, title: 'What I want', stage: 'clarify', screen: 'c.sum', rows: [f('c.sum', true), { kind: 'wants', label: 'Goals and values', core: true }, f('c.resolved'), f('c.success', true), f('c.limits', true)] },
      { n: 3, title: 'Alternatives explored', stage: 'explore', screen: 'x.ideas', rows: [{ kind: 'ideas', label: 'Possibilities', core: true }, f('x.assume', true), f('x.questions')] },
      { n: 4, title: 'The leverage point', stage: 'leverage', screen: 'l.pick', rows: [f('l.pick', true), f('l.bottleneck', true), f('l.several'), f('l.cost'), f('l.why', true)] },
      { n: 5, title: 'Decision and rationale', stage: 'act', screen: 'a.outcome', rows: [{ kind: 'outcome', label: 'Where I landed', core: true }, f('a.decision', true), f('a.why', true), f('a.change', true)] },
      { n: 6, title: 'Next actions', stage: 'act', screen: 'a.actions', rows: [{ kind: 'actions', label: 'Actions', core: true }] },
      { n: 7, title: 'Review', stage: 'act', screen: 'a.review', rows: [{ kind: 'returnOn', label: 'When to revisit this', core: true }, f('r.evidence', true), f('r.learned', true), { kind: 'checkins', label: 'What has happened since', core: true }] }
    ];
  }

  const outcomeLabel = (t) => (WF.OUTCOMES.find((o) => o.id === t.outcome) || {}).label || '';
  const isoToDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return fdate(new Date(y, m - 1, d).getTime()); };

  function meta(t) {
    return {
      status: WF.STATUS[t.status],
      started: fdate(t.createdAt),
      last: fdate(t.updatedAt),
      sittings: M.sittingCount(t)
    };
  }

  const liveIdeas = (t) => t.ideas.filter((i) => M.has(i.text));
  const liveActions = (t) => t.actions.filter((a) => M.has(a.text));
  const liveWants = (t) => t.wants.filter((w) => M.has(w.text));
  const checkins = (t) => t.log.filter((l) => M.has(l.text));
  const ideaLine = (i) => `${i.text}${i.mark === 'promising' ? ' (promising)' : ''}${i.mark === 'dropped' ? ` (dropped${i.why ? `: ${i.why}` : ''})` : ''}${i.note ? ` — ${i.note}` : ''}`;
  const trig = (a) => [a.trigger, a.when && isoToDate(a.when)].filter(Boolean).join(', ') || '—';
  const obst = (a) => [a.obstacle, a.fallback && `Fallback: ${a.fallback}`].filter(Boolean).join('. ') || '—';
  const actionState = (a) => (a.state === 'open' ? 'Open' : WF.CHECKIN[a.state].label);
  const logDate = (l) => new Date(l.at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const cell = (s) => String(s).replace(/\|/g, '\\|').replace(/\n+/g, ' ');

  function rowLines(t, row, style) {
    const b = style === 'md' ? '- ' : '  - ';
    switch (row.kind) {
      case 'field': return M.has(t.a[row.key]) ? [t.a[row.key].trim()] : [];
      case 'wants': return liveWants(t).map((w) => `${b}${w.text} (${WF.WANT_KINDS[w.kind].toLowerCase()})`);
      case 'ideas': return liveIdeas(t).map((i) => b + ideaLine(i));
      case 'outcome': return outcomeLabel(t) ? [outcomeLabel(t)] : [];
      case 'returnOn': return t.returnOn ? [isoToDate(t.returnOn)] : [];
      case 'checkins': return checkins(t).map((l) => `${b}${logDate(l)}: ${l.text}`);
      default: return [];
    }
  }

  function actionsMd(t) {
    const rows = liveActions(t);
    if (!rows.length) return [];
    return [
      '| Type | Action | Trigger / when | Done when | Obstacle / fallback | Status |',
      '| --- | --- | --- | --- | --- | --- |',
      ...rows.map((a) => `| ${WF.ACTION_TYPES[a.type].label} | ${cell(a.text)}${a.first ? ` (start: ${cell(a.first)})` : ''} | ${cell(trig(a))} | ${cell(a.done || '—')} | ${cell(obst(a))} | ${actionState(a)}${a.result ? `: ${cell(a.result)}` : ''} |`)
    ];
  }

  function actionsText(t) {
    return liveActions(t).flatMap((a) => [
      `  ${WF.ACTION_TYPES[a.type].label}: ${a.text}`,
      ...[['First step', a.first], ['Trigger', a.trigger], ['When', a.when && isoToDate(a.when)], ['Done when', a.done], ['Obstacle', a.obstacle], ['Fallback', a.fallback], ['What it will tell me', a.evidence], ['Status', actionState(a) + (a.result ? `: ${a.result}` : '')]]
        .filter(([, v]) => v).map(([k, v]) => `    ${k}: ${v}`),

    ]);
  }

  function exerciseEntries(t, ex) {
    const tech = WF.TECHNIQUES[ex.tech];
    const out = [];
    for (const s of tech.steps) {
      const v = ex.answers[s.id];
      if (s.kind === 'text' && M.has(v)) out.push([s.q, v]);
      if (s.kind === 'list' && Array.isArray(v)) {
        const l = v.filter((x) => M.has(x.text)).map((x) => x.text).join('; ');

      if (s.kind === 'each' && v) {
        const l = (ex.answers[s.from] || []).filter((x) => M.has(x.text) && v[x.id]).map((x) => `${x.text}: ${[v[x.id].pick, v[x.id].text].filter(Boolean).join(', ')}`).join('; ');
        if (l) out.push([s.q, l]);
      }
      if (s.kind === 'pick' && v) {
        const it = (ex.answers[s.from] || []).find((x) => x.id === v);
        if (it) out.push([s.q, it.text]);
      }
      if (s.kind === 'action' && v) {
        const x = v.id ? t.actions.find((a) => a.id === v.id) : null;
        const text = x ? x.text : v.text;
        if (M.has(text)) out.push([s.q, text]);
      }
    }
    if (M.has(ex.debrief)) out.push([tech.debrief, ex.debrief]);
    return out;
  }

  function history(t) {
    return Object.entries(t.history).flatMap(([k, v]) => v.map((h) => ({ label: WF.FIELD_LABELS[k] || k, at: h.at, text: h.text })));
  }

  function renderDoc(t, full, style) {
    const md = style === 'md';
    const m = meta(t);
    const out = [];
    const h = (lvl, s) => out.push(md ? `${'#'.repeat(lvl)} ${s}` : s, '');
    if (md) h(1, 'Thinking Brief');
    else out.push('THINKING BRIEF', '==============', '');
    out.push(md ? `**${t.title}**` : t.title, '');
    const metaRows = [['Status', m.status], ['Started', m.started], ['Last worked on', m.last], ['Sittings', m.sittings]];
    out.push(...metaRows.map(([k, v]) => (md ? `**${k}:** ${v}  ` : `${k}: ${v}`)), '');

    for (const sec of sections()) {
      const body = [];
      for (const row of sec.rows) {
        if (!full && !row.core) continue;
        if (row.kind === 'actions') {
          const lines = md ? actionsMd(t) : actionsText(t);
          if (lines.length) body.push(...lines, '');
          continue;
        }
        const lines = rowLines(t, row, style);
        if (!lines.length) continue;
        body.push(md ? `**${row.label}**` : `${row.label}:`);
        if (md) body.push('', ...lines, '');
        else body.push(...lines.map((l) => (l.startsWith('  ') ? l : `  ${l.replace(/\n/g, '\n  ')}`)), '');
      }
      if (!body.length) continue;
      h(2, `${sec.n}. ${sec.title}`);
      if (!md) { out.splice(out.length - 1, 0, '-'.repeat(`${sec.n}. ${sec.title}`.length)); }
      out.push(...body);
    }

    if (full) {
      const done = t.exercises.filter((e) => exerciseEntries(t, e).length);
      if (done.length) {
        h(2, 'Exercises');
        for (const ex of done) {
          h(3, `${WF.TECHNIQUES[ex.tech].name}${ex.status === 'done' ? '' : ' (unfinished)'}`);
          for (const [q, a] of exerciseEntries(t, ex)) out.push(md ? `**${q}**` : q, '', a, '');

      }

      if (old.length) {

        for (const o of old) out.push(md ? `**${o.label}** (until ${logDate(o)})` : `${o.label} (until ${logDate(o)})`, '', o.text, '');
      }
      const notes = t.sittings.filter((s) => s.note);
      if (notes.length) {
        h(2, 'Notes to myself');
        for (const s of notes) out.push(`${md ? '- ' : '  '}${logDate({ at: s.start })}: ${s.note}`);
        out.push('');
      }
    }
    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
  }

  WF.brief = {
    sections, meta, outcomeLabel, isoToDate, exerciseEntries, history, ideaLine, trig, obst, actionState, logDate,
    liveIdeas, liveActions, liveWants, checkins,
    markdown: (t, full) => renderDoc(t, full, 'md'),
    text: (t, full) => renderDoc(t, full, 'text')
  };
})();
