<style>
  :root{
    --bg:#EFEDE2;
    --bg-panel:#F8F6EC;
    --bg-panel-raised:#FCFAF2;
    --ink:#1B241E;
    --ink-soft:#565F55;
    --ink-faint:#8B9186;
    --moss:#3E6656;
    --moss-tint:#DDE7DD;
    --ochre:#A8793A;
    --rust:#9C4A34;
    --line:#D8D2BE;
    --line-soft:#E3DECB;
    --shadow: 0 1px 2px rgba(27,36,30,0.06), 0 6px 20px rgba(27,36,30,0.05);
    --radius:4px;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
    color-scheme: light;
  }
  html[data-theme="dark"]{
    --bg:#12160F;
    --bg-panel:#191E15;
    --bg-panel-raised:#1F2519;
    --ink:#ECE9DD;
    --ink-soft:#AAB2A2;
    --ink-faint:#707A6C;
    --moss:#84B79A;
    --moss-tint:#233026;
    --ochre:#D5A45F;
    --rust:#D08267;
    --line:#2B3226;
    --line-soft:#232A1F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  ::selection{background:var(--moss); color:var(--bg-panel-raised);}
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{outline:2px solid var(--moss); outline-offset:2px; border-radius:2px;}

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:18px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:var(--bg-panel);
  }
  .brand{display:flex; align-items:baseline; gap:9px; flex:0 0 auto;}
  .brand h1{
    font-family:var(--font-display);
    font-size:1.32rem;
    font-weight:700;
    margin:0;
    letter-spacing:0.01em;
    white-space:nowrap;
  }
  .brand .tagline{
    font-family:var(--font-mono);
    font-size:0.62rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-faint);
    white-space:nowrap;
    display:none;
  }
  @media (min-width:640px){ .brand .tagline{display:inline;} }

  .search-wrap{
    position:relative;
    flex:1 1 auto;
    max-width:520px;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-panel-raised);
    border:1px solid var(--line);
    border-radius:20px;
    padding:8px 14px;
  }
  .search-box svg{flex:0 0 auto; color:var(--ink-faint); width:15px; height:15px;}
  .search-box input{
    border:none; outline:none; background:transparent;
    font-family:var(--font-body);
    font-size:0.88rem;
    color:var(--ink);
    width:100%;
  }
  .search-box input::placeholder{color:var(--ink-faint);}
  .clear-btn{
    display:none;
    border:none; background:none; color:var(--ink-faint);
    padding:2px; line-height:0;
  }
  .clear-btn.show{display:flex;}

  .search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--bg-panel-raised);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:var(--shadow);
    max-height:min(60vh,420px);
    overflow-y:auto;
    z-index:40;
    display:none;
  }
  .search-results.open{display:block;}
  .search-result{
    display:flex; flex-direction:column; gap:2px;
    padding:9px 14px;
    border-bottom:1px solid var(--line-soft);
  }
  .search-result:last-child{border-bottom:none;}
  .search-result:hover, .search-result.sel{background:var(--moss-tint);}
  .search-result .r-term{font-family:var(--font-display); font-weight:700; font-size:0.98rem;}
  .search-result .r-path{font-family:var(--font-mono); font-size:0.66rem; letter-spacing:0.04em; color:var(--ink-faint); text-transform:uppercase;}
  .search-result .r-def{font-size:0.78rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .search-result.is-root{border-left:3px solid var(--ochre); background:var(--bg-panel);}
  .search-result.is-root .r-path{color:var(--ochre);}
  .search-result.is-root .r-def{white-space:normal; font-style:italic; font-family:var(--font-display);}
  .search-empty{padding:16px 14px; font-size:0.82rem; color:var(--ink-faint); font-style:italic;}

  .header-actions{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink-soft);
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .icon-btn svg{width:17px; height:17px;}
  .icon-btn:hover{background:var(--moss-tint); color:var(--moss); border-color:var(--line);}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:var(--bg);
    font-family:var(--font-mono); font-size:0.78rem; letter-spacing:0.02em;
    padding:9px 16px; border-radius:20px;
    opacity:0; pointer-events:none;
    transition:opacity 0.22s ease, transform 0.22s ease;
    z-index:100;
    box-shadow:var(--shadow);
  }
  html[data-theme="dark"] #toast{background:var(--moss); color:var(--bg-panel);}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- breadcrumb (mobile) ---------- */
  .crumb-bar{
    display:none;
    align-items:center; gap:8px;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    background:var(--bg-panel);
    font-family:var(--font-mono);
    font-size:0.72rem;
    color:var(--ink-soft);
    overflow-x:auto;
    white-space:nowrap;
  }
  .crumb-bar button.back{
    border:none; background:none; color:var(--moss);
    display:flex; align-items:center; gap:3px;
    font-family:var(--font-body); font-weight:600; font-size:0.82rem;
    padding:2px 4px 2px 0; flex:0 0 auto;
  }
  .crumb-bar button.back svg{width:14px; height:14px;}
  .crumb-seg{cursor:pointer;}
  .crumb-seg:hover{color:var(--moss); text-decoration:underline;}
  .crumb-sep{color:var(--ink-faint);}

  /* ---------- main layout ---------- */
  main{
    flex:1 1 auto;
    display:flex;
    min-height:0;
    overflow:hidden;
  }
  .miller{
    display:flex;
    flex:0 0 44%;
    max-width:560px;
    min-width:300px;
    border-right:1px solid var(--line);
    overflow:hidden;
  }
  .col{
    flex:1 1 0;
    min-width:0;
    overflow-y:auto;
    border-right:1px solid var(--line-soft);
    background:var(--bg-panel);
  }
  .col:last-child{border-right:none;}
  .col-roots{flex:0 0 168px;}
  .col-clusters{flex:1 1 0;}
  .col-subs{flex:1 1 0;}

  .col-head{
    position:sticky; top:0;
    background:var(--bg-panel);
    padding:11px 14px 8px;
    font-family:var(--font-mono);
    font-size:0.62rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-faint);
    border-bottom:1px solid var(--line-soft);
    z-index:2;
  }
  .col-blurb{
    padding:6px 14px 14px;
    font-family:var(--font-display);
    font-style:italic;
    font-size:0.82rem;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line-soft);
  }

  .root-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 14px;
    border-left:3px solid transparent;
    border-bottom:1px solid var(--line-soft);
    transition:background 0.14s, border-color 0.14s, transform 0.14s;
    background:none; width:100%; text-align:left; color:var(--ink);
  }
  .root-item .code{
    font-family:var(--font-mono); font-size:0.68rem; color:var(--ink-faint);
    width:20px; flex:0 0 auto;
  }
  .root-item .label{font-family:var(--font-display); font-size:0.94rem; line-height:1.25;}
  .root-item:hover{background:var(--moss-tint); transform:translateX(2px);}
  .root-item.active{border-left-color:var(--moss); background:var(--moss-tint);}
  .root-item.active .code{color:var(--moss);}
  .root-item.active .label{font-weight:700;}

  .cluster-item, .sub-item{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    width:100%; text-align:left;
    padding:10px 14px;
    border-bottom:1px solid var(--line-soft);
    background:none; color:var(--ink);
    transition:background 0.14s;
  }
  .cluster-item .name, .sub-item .name{font-family:var(--font-body); font-size:0.86rem;}
  .cluster-item .count, .sub-item .count{font-family:var(--font-mono); font-size:0.62rem; color:var(--ink-faint);}
  .cluster-item svg, .sub-item svg{width:13px; height:13px; color:var(--ink-faint); flex:0 0 auto;}
  .cluster-item:hover, .sub-item:hover{background:var(--moss-tint);}
  .cluster-item.active, .sub-item.active{background:var(--moss-tint); font-weight:600;}
  .cluster-item.active svg, .sub-item.active svg{color:var(--moss);}

  .empty-col{padding:22px 14px; font-size:0.8rem; color:var(--ink-faint); font-style:italic;}

  /* ---------- detail panel ---------- */
  .detail{
    flex:1 1 auto;
    min-width:0;
    overflow-y:auto;
    padding:22px 26px 60px;
  }
  .detail-head{margin-bottom:16px;}
  .detail-head .eyebrow{
    font-family:var(--font-mono); font-size:0.64rem; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--ink-faint);
  }
  .detail-head h2{
    font-family:var(--font-display); font-size:1.5rem; margin:2px 0 3px;
    letter-spacing:0.01em;
  }
  .detail-head .sub{font-family:var(--font-display); font-style:italic; color:var(--ink-soft); font-size:0.92rem;}

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:16px;
  }

  .word-card{
    position:relative;
    background:var(--bg-panel-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px 14px 28px;
    box-shadow:var(--shadow);
    transition:box-shadow 0.16s, transform 0.16s, border-color 0.5s;
  }
  .word-card.flash{
    border-color:var(--ochre);
    animation:flashcard 1.7s ease;
  }
  @keyframes flashcard{
    0%{box-shadow:0 0 0 3px var(--ochre), var(--shadow);}
    100%{box-shadow:var(--shadow);}
  }
  .word-card::before, .word-card::after{
    content:""; position:absolute; left:9px; width:7px; height:7px; border-radius:50%;
    background:var(--bg); box-shadow:inset 0 0 0 1px var(--line);
  }
  .word-card::before{top:16px;}
  .word-card::after{bottom:16px;}
  .word-code{
    font-family:var(--font-mono); font-size:0.65rem; letter-spacing:0.05em;
    color:var(--moss); text-transform:uppercase; display:block; margin-bottom:4px;
  }
  .word-term{
    font-family:var(--font-display); font-size:1.32rem; font-weight:700;
    margin:0 0 6px; color:var(--ink);
  }
  .word-def{
    font-size:0.86rem; line-height:1.48; color:var(--ink-soft); margin:0 0 10px;
  }
  .word-example{
    font-family:var(--font-display); font-style:italic; font-size:0.85rem;
    color:var(--ink-soft);
    border-left:2px solid var(--ochre);
    padding-left:10px; margin:0 0 12px;
  }
  .card-foot{display:flex; justify-content:flex-end;}
  .copy-btn{
    display:flex; align-items:center; gap:5px;
    border:1px solid var(--line); background:var(--bg-panel);
    border-radius:14px; padding:5px 11px 5px 9px;
    font-size:0.72rem; color:var(--ink-soft);
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .copy-btn svg{width:12px; height:12px;}
  .copy-btn:hover{background:var(--moss); color:var(--bg-panel-raised); border-color:var(--moss);}

  .placeholder{
    display:flex; flex-direction:column; align-items:flex-start; gap:6px;
    padding:40px 4px; max-width:420px;
  }
  .placeholder .big{font-family:var(--font-display); font-size:1.2rem;}
  .placeholder p{font-size:0.86rem; color:var(--ink-soft); line-height:1.5; margin:0;}

  /* ---------- footer note ---------- */
  footer{
    flex:0 0 auto;
    padding:6px 20px;
    border-top:1px solid var(--line);
    background:var(--bg-panel);
    font-family:var(--font-mono);
    font-size:0.62rem;
    color:var(--ink-faint);
    letter-spacing:0.03em;
    display:flex; justify-content:space-between;
  }

  /* ---------- mobile ---------- */
  @media (max-width:880px){
    .miller{flex:1 1 auto; max-width:none; min-width:0; border-right:none;}
    .col-roots, .col-clusters, .col-subs{flex:1 1 100%; display:none;}
    .detail{display:none; flex:1 1 auto; padding:16px 16px 60px;}
    main{position:relative;}
    .crumb-bar{display:flex;}
    body[data-screen="roots"] .col-roots{display:block;}
    body[data-screen="clusters"] .col-clusters{display:block;}
    body[data-screen="subs"] .col-subs{display:block;}
    body[data-screen="words"] .detail{display:block;}
    .brand .tagline{display:none;}
    .card-grid{grid-template-columns:1fr;}
  }
  @media (min-width:881px){
    .crumb-bar{display:none !important;}
  }
</style>
</head>

<script>
(function(){
"use strict";

/* =====================================================
   DATA — 9 root concepts, each broken into clusters of
   meaning, each cluster into a nuance, each nuance into
   a small set of precise words.
   ===================================================== */
var DATA = [
{id:"AM", root:"Amazing / Good", blurb:"For when \u201camazing\u201d or \u201cgood\u201d can\u2019t carry the weight.", clusters:[
  {name:"Aesthetic & Visual", subs:[
    {nuance:"Breathtaking & Grand", words:[
      {t:"Sublime", d:"Of such beauty or grandeur it inspires awe rather than mere admiration.", e:"The glacier's blue crevasses were sublime, silencing the whole group."},

    {nuance:"Refined & Flawless", words:[

  ]},
  {name:"Achievement & Milestone", subs:[
    {nuance:"Triumphant & Stellar", words:[
      {t:"Phenomenal", d:"Outstandingly remarkable, often defying expectations.", e:"She gave a phenomenal presentation that secured the contract."},
      {t:"Sensational", d:"Exceptionally good, causing great excitement or interest.", e:"The team pulled off a sensational victory in the final seconds."},
      {t:"Stellar", d:"Outstandingly good, shining brightly among others.", e:"He has a stellar track record of closing complex deals."},
      {t:"Triumphant", d:"Marked by a feeling of victory or great success.", e:"It was a triumphant return to the stage after years away."}
    ]},
    {nuance:"Deserved & Earned", words:[
      {t:"Merited", d:"Fully deserved based on one's actions or qualities.", e:"Her promotion was merited, the result of years of dedication."},
      {t:"Hard-won", d:"Achieved only through great effort or struggle.", e:"It was a hard-won victory after months of grueling negotiations."},
      {t:"Well-earned", d:"Fully justified by effort or contribution.", e:"Enjoy your well-earned rest this weekend."},
      {t:"Deserved", d:"Rightly earned or warranted, in plain terms.", e:"He got the recognition he deserved."}
    ]}
  ]},
  {name:"Personal Character", subs:[
    {nuance:"Exceptional Qualities", words:[
      {t:"Extraordinary", d:"Beyond what is ordinary, in a highly striking way.", e:"She has an extraordinary ability to connect with people."},

    {nuance:"Exclamatory Praise", words:[

      {t:"Fabulous", d:"Exceptionally good, often with a flair of enthusiasm.", e:"She did a fabulous job organizing the event."}

  ]},
  {name:"Skill & Craft", subs:[
    {nuance:"Masterfully Executed", words:[
      {t:"Masterful", d:"Executed with the complete authority of someone who has fully mastered a craft.", e:"It was a masterful negotiation; she never once raised her voice."},

/* =====================================================
   SYNONYM / TRIGGER MAP
   Everyday and mid-register words people actually type
   ("awesome", "huge", "annoyed"...) mapped to the root
   whose whole cluster of curated words answers that
   search, even though the trigger word itself never
   appears in the data. Keeps a search from ever going
   to "no matches" for a common adjective.
   ===================================================== */
var ROOT_TRIGGERS = {
  AM: ["awesome","amazing","great","good","fantastic","wonderful","excellent","superb","terrific","incredible","fabulous","marvelous","marvellous","stellar","outstanding","phenomenal","first-rate","first class","brilliant","cool","nice","top-notch","glorious","splendid","magnificent","perfect","superior","world-class","impressive"],
  IN: ["interesting","cool","neat","engaging","fun","intriguing","fascinating","stimulating","gripping","catchy","compelling","novel","noteworthy","remarkable","eye-catching"],
  BD: ["bad","terrible","awful","horrible","poor","crappy","lousy","rubbish","garbage","trash","subpar","sub-par","inferior","disappointing","atrocious","dreadful","lame","sucky","crummy","rotten","appalling","unsatisfactory","second-rate","abysmal","wretched"],
  HD: ["hard","difficult","tough","challenging","demanding","tricky","complicated","complex","strenuous","laborious","brutal","gnarly","rough"],
  BR: ["boring","dull","plain","bland","tedious","meh","uninteresting","monotonous","lame","flat","stale","unexciting","drab","tiresome","stodgy","vanilla"],
  HP: ["happy","joyful","glad","pleased","delighted","cheerful","thrilled","upbeat","content","satisfied","chipper","merry","gleeful","stoked","overjoyed","chuffed"],
  SD: ["sad","upset","unhappy","angry","mad","furious","annoyed","frustrated","down","blue","gloomy","irritated","miserable","heartbroken","grumpy","cross","bummed","distressed","disheartened"],
  BG: ["big","large","huge","giant","enormous","gigantic","humongous","massive","vast","colossal","tremendous","hefty","sizable","sizeable","whopping"],
  SM: ["small","tiny","little","mini","teeny","petite","miniature","itty-bitty","microscopic","compact","puny","pint-sized","minute"]
};

/* =====================================================

   ===================================================== */

/* =====================================================
   HELPERS
   ===================================================== */
function pad2(n){ return n < 10 ? '0'+n : ''+n; }

function totalWords(){
  var c = 0;
  DATA.forEach(function(r){
    r.clusters.forEach(function(cl){
      cl.subs.forEach(function(s){ c += s.words.length; });
    });
  });
  return c;
}

function wordCode(rootId, clusterIdx, wordGlobalIdx){
  return rootId + '-' + (clusterIdx+1) + '.' + pad2(wordGlobalIdx+1);
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function svgChevron(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>';
}
function svgBack(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
}
function svgCopy(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V5a1.5 1.5 0 0 1 1.5-1.5H15"/></svg>';
}

/* =====================================================
   RENDER: columns
   ===================================================== */
function renderRoots(){
  var html = '<div class="col-head">Roots</div>';
  DATA.forEach(function(r, i){
    html += '<button class="root-item'+(i===state.root?' active':'')+'" data-i="'+i+'">'+
      '<span class="code">'+r.id+'</span><span class="label">'+r.root+'</span>'+
    '</button>';
  });
  colRoots.innerHTML = html;
  Array.prototype.forEach.call(colRoots.querySelectorAll('.root-item'), function(btn){
    btn.addEventListener('click', function(){
      state.root = parseInt(btn.getAttribute('data-i'), 10);
      state.cluster = 0; state.sub = 0;
      renderAll();
      goScreen('clusters');
    });
  });
}

function renderClusters(){
  var root = DATA[state.root];
  var html = '<div class="col-head">'+escapeHtml(root.root)+'</div>';
  html += '<div class="col-blurb">'+escapeHtml(root.blurb)+'</div>';
  root.clusters.forEach(function(cl, i){
    var wc = cl.subs.reduce(function(a,s){ return a + s.words.length; }, 0);
    html += '<button class="cluster-item'+(i===state.cluster?' active':'')+'" data-i="'+i+'">'+
      '<span class="name">'+escapeHtml(cl.name)+'</span><span class="count">'+wc+'</span>'+svgChevron()+
    '</button>';
  });
  colClusters.innerHTML = html;
  Array.prototype.forEach.call(colClusters.querySelectorAll('.cluster-item'), function(btn){
    btn.addEventListener('click', function(){
      state.cluster = parseInt(btn.getAttribute('data-i'), 10);
      state.sub = 0;
      renderAll();
      goScreen('subs');
    });
  });
}

function renderSubs(){
  var root = DATA[state.root];
  var cluster = root.clusters[state.cluster];
  var html = '<div class="col-head">'+escapeHtml(cluster.name)+'</div>';
  cluster.subs.forEach(function(s, i){
    html += '<button class="sub-item'+(i===state.sub?' active':'')+'" data-i="'+i+'">'+
      '<span class="name">'+escapeHtml(s.nuance)+'</span><span class="count">'+s.words.length+'</span>'+svgChevron()+
    '</button>';
  });
  colSubs.innerHTML = html;
  Array.prototype.forEach.call(colSubs.querySelectorAll('.sub-item'), function(btn){
    btn.addEventListener('click', function(){
      state.sub = parseInt(btn.getAttribute('data-i'), 10);
      renderAll();
      goScreen('words');
    });
  });
}

function wordGlobalIndexInCluster(cluster, subIdx, wordIdx){
  var idx = 0;
  for (var i=0;i<subIdx;i++){ idx += cluster.subs[i].words.length; }
  return idx + wordIdx;
}

function wordCardHtml(rootId, clusterIdx, cluster, subIdx, wordIdx){
  var s = cluster.subs[subIdx];
  var w = s.words[wordIdx];
  var gIdx = wordGlobalIndexInCluster(cluster, subIdx, wordIdx);
  var code = wordCode(rootId, clusterIdx, gIdx);
  return '<div class="word-card" data-term="'+escapeHtml(w.t)+'" id="card-'+code+'">'+
    '<span class="word-code">'+code+'</span>'+
    '<h3 class="word-term">'+escapeHtml(w.t)+'</h3>'+
    '<p class="word-def">'+escapeHtml(w.d)+'</p>'+
    '<p class="word-example">\u201c'+escapeHtml(w.e)+'\u201d</p>'+
    '<div class="card-foot"><button class="copy-btn" data-word="'+escapeHtml(w.t)+'">'+svgCopy()+'Copy</button></div>'+
  '</div>';
}

function renderDetail(){
  var root = DATA[state.root];
  var cluster = root.clusters[state.cluster];
  var sub = cluster.subs[state.sub];
  var html = '<div class="detail-head">'+
    '<span class="eyebrow">'+escapeHtml(root.root)+' \u2014 '+escapeHtml(cluster.name)+'</span>'+
    '<h2>'+escapeHtml(sub.nuance)+'</h2>'+
    '<span class="sub">'+sub.words.length+' curated word'+(sub.words.length===1?'':'s')+'</span>'+
  '</div><div class="card-grid">';
  sub.words.forEach(function(w, i){
    html += wordCardHtml(root.id, state.cluster, cluster, state.sub, i);
  });
  html += '</div>';
  detailEl.innerHTML = html;
  bindCopyButtons();
}

function bindCopyButtons(){
  Array.prototype.forEach.call(detailEl.querySelectorAll('.copy-btn'), function(btn){
    btn.addEventListener('click', function(){
      var word = btn.getAttribute('data-word');
      copyWord(word);
    });
  });
}

function copyWord(word){
  function done(ok){
    showToast(ok ? '\u201c'+word+'\u201d copied' : 'Couldn\u2019t copy \u2014 select and copy manually');
  }
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(word).then(function(){ done(true); }).catch(function(){ done(false); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = word; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
  }catch(e){ done(false); }
}

var toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
}

/* =====================================================
   BREADCRUMB (mobile)
   ===================================================== */
function currentScreen(){ return document.body.getAttribute('data-screen') || 'roots'; }

function goScreen(name){
  document.body.setAttribute('data-screen', name);
  renderCrumb();
  if (window.innerWidth <= 880){ detailEl.scrollTop = 0; colClusters.scrollTop = 0; colSubs.scrollTop = 0; }
}

function renderCrumb(){
  var screen = currentScreen();
  var root = DATA[state.root];
  var cluster = root.clusters[state.cluster];
  var sub = cluster.subs[state.sub];
  var html = '';
  if (screen !== 'roots'){
    html += '<button class="back" id="crumbBack">'+svgBack()+'Back</button>';
  }
  var segs = [];
  segs.push({label:'Roots', screen:'roots'});
  if (screen === 'clusters' || screen === 'subs' || screen === 'words'){
    segs.push({label:root.id, screen:'clusters'});
  }
  if (screen === 'subs' || screen === 'words'){
    segs.push({label:cluster.name, screen:'subs'});
  }
  if (screen === 'words'){
    segs.push({label:sub.nuance, screen:'words'});
  }
  segs.forEach(function(seg, i){
    if (i>0) html += '<span class="crumb-sep">/</span>';
    html += '<span class="crumb-seg" data-screen="'+seg.screen+'">'+escapeHtml(seg.label)+'</span>';
  });
  crumbBar.innerHTML = html;
  var backBtn = document.getElementById('crumbBack');
  if (backBtn){
    backBtn.addEventListener('click', function(){
      if (screen==='clusters') goScreen('roots');
      else if (screen==='subs') goScreen('clusters');
      else if (screen==='words') goScreen('subs');
    });
  }
  Array.prototype.forEach.call(crumbBar.querySelectorAll('.crumb-seg'), function(seg){
    seg.addEventListener('click', function(){ goScreen(seg.getAttribute('data-screen')); });
  });
}

/* =====================================================
   MAIN RENDER
   ===================================================== */
function renderAll(){
  renderRoots();
  renderClusters();
  renderSubs();
  renderDetail();
  renderCrumb();
}

/* =====================================================
   NAVIGATE TO A SPECIFIC WORD (search / random)
   ===================================================== */
function navigateTo(rootIdx, clusterIdx, subIdx, wordIdx, code){
  state.root = rootIdx; state.cluster = clusterIdx; state.sub = subIdx;
  renderAll();
  goScreen('words');
  requestAnimationFrame(function(){
    var card = document.getElementById('card-'+code);
    if (card){
      card.scrollIntoView({block:'center', behavior:'smooth'});
      card.classList.add('flash');
      setTimeout(function(){ card.classList.remove('flash'); }, 1700);
    }
  });
}

/* =====================================================
   SEARCH
   ===================================================== */
var flatIndex = [];
(function buildIndex(){
  DATA.forEach(function(root, ri){
    root.clusters.forEach(function(cl, ci){
      cl.subs.forEach(function(s, si){
        s.words.forEach(function(w, wi){
          var gIdx = wordGlobalIndexInCluster(cl, si, wi);
          flatIndex.push({
            ri:ri, ci:ci, si:si, wi:wi,
            code: wordCode(root.id, ci, gIdx),
            term: w.t, def: w.d,
            rootName: root.root, clusterName: cl.name, nuance: s.nuance,
            hay: (w.t+' '+w.d+' '+s.nuance+' '+cl.name+' '+root.root).toLowerCase()
          });
        });
      });
    });
  });
})();

var searchSelIdx = -1;
var currentMatches = [];
var searchTracked = false;

function rootWordCount(root){
  var c = 0;
  root.clusters.forEach(function(cl){ cl.subs.forEach(function(s){ c += s.words.length; }); });
  return c;
}

function triggerHits(q, trig){
  if (trig === q) return true;
  if (q.length >= 3 && trig.indexOf(q) === 0) return true; // partial typing: "awe" -> "awesome"
  var esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  var re = new RegExp('(^|[\\s-])' + esc + '($|[\\s-])');
  return re.test(trig);
}

function findTriggerRootMatches(q, excludeRootIdxs){
  var out = [];
  DATA.forEach(function(root, ri){
    if (excludeRootIdxs[ri]) return;
    var trigs = ROOT_TRIGGERS[root.id] || [];
    var hit = trigs.some(function(t){ return triggerHits(q, t); });
    if (!hit) return;
    var cluster0 = root.clusters[0], sub0 = cluster0.subs[0];
    var gIdx = wordGlobalIndexInCluster(cluster0, 0, 0);
    out.push({
      ri: ri, ci: 0, si: 0, wi: 0,
      code: wordCode(root.id, 0, gIdx),
      term: root.root, def: root.blurb,
      rootName: root.root, clusterName: cluster0.name, nuance: sub0.nuance,
      isRoot: true, wordCount: rootWordCount(root)
    });
  });
  return out;
}

function runSearch(q){
  q = q.trim().toLowerCase();
  clearSearchBtn.classList.toggle('show', q.length > 0);
  if (!q){
    searchResultsEl.classList.remove('open');
    searchResultsEl.innerHTML = '';
    currentMatches = [];
    return;
  }
  var wordMatches = flatIndex.filter(function(item){ return item.hay.indexOf(q) !== -1; }).slice(0, 18);
  var matchedRoots = {};
  wordMatches.forEach(function(m){ matchedRoots[m.ri] = true; });
  var rootMatches = findTriggerRootMatches(q, matchedRoots);
  currentMatches = wordMatches.concat(rootMatches).slice(0, 24);
  searchSelIdx = -1;
  if (currentMatches.length === 0){
    searchResultsEl.innerHTML = '<div class="search-empty">No matches for \u201c'+escapeHtml(q)+'\u201d \u2014 try a feeling or a related word.</div>';
  } else {
    searchResultsEl.innerHTML = currentMatches.map(function(m, i){
      if (m.isRoot){
        return '<div class="search-result is-root" data-i="'+i+'">'+
          '<span class="r-term">'+escapeHtml(m.term)+'</span>'+
          '<span class="r-path">ROOT \u00b7 '+m.wordCount+' curated words</span>'+
          '<span class="r-def">'+escapeHtml(m.def)+'</span>'+
        '</div>';
      }
      return '<div class="search-result" data-i="'+i+'">'+
        '<span class="r-term">'+escapeHtml(m.term)+'</span>'+
        '<span class="r-path">'+escapeHtml(m.rootName)+' \u2192 '+escapeHtml(m.clusterName)+' \u2192 '+escapeHtml(m.nuance)+'</span>'+
        '<span class="r-def">'+escapeHtml(m.def)+'</span>'+
      '</div>';
    }).join('');
    Array.prototype.forEach.call(searchResultsEl.querySelectorAll('.search-result'), function(el){
      el.addEventListener('click', function(){
        pickMatch(parseInt(el.getAttribute('data-i'),10));
      });
    });
  }
  searchResultsEl.classList.add('open');
}

function pickMatch(i){
  var m = currentMatches[i];
  if (!m) return;
  trackNuance('tool_result_select', {
    experience_action: 'result_select',
    result_category: m.rootName || 'root'
  });
  navigateTo(m.ri, m.ci, m.si, m.wi, m.code);
  searchResultsEl.classList.remove('open');
  searchInput.value = '';
  clearSearchBtn.classList.remove('show');
  searchInput.blur();
}

searchInput.addEventListener('input', function(){
  var query = searchInput.value.trim();
  if (query && !searchTracked){
    searchTracked = true;
    trackNuance('tool_search', {
      experience_action: 'search_start',
      query_length: query.length
    });
  } else if (!query){
    searchTracked = false;
  }
  runSearch(searchInput.value);
});
searchInput.addEventListener('keydown', function(e){
  if (!searchResultsEl.classList.contains('open')) return;
  if (e.key === 'ArrowDown'){
    e.preventDefault();
    searchSelIdx = Math.min(searchSelIdx+1, currentMatches.length-1);
    highlightSel();
  } else if (e.key === 'ArrowUp'){
    e.preventDefault();
    searchSelIdx = Math.max(searchSelIdx-1, 0);
    highlightSel();
  } else if (e.key === 'Enter'){
    e.preventDefault();
    pickMatch(searchSelIdx >= 0 ? searchSelIdx : 0);
  } else if (e.key === 'Escape'){
    searchResultsEl.classList.remove('open');
    searchInput.blur();
  }
});
function highlightSel(){
  Array.prototype.forEach.call(searchResultsEl.querySelectorAll('.search-result'), function(el, i){
    el.classList.toggle('sel', i === searchSelIdx);
    if (i === searchSelIdx) el.scrollIntoView({block:'nearest'});
  });
}
clearSearchBtn.addEventListener('click', function(){
  searchInput.value = ''; runSearch(''); searchInput.focus();
});
document.addEventListener('click', function(e){
  if (!e.target.closest('.search-wrap')){ searchResultsEl.classList.remove('open'); }
});

   RANDOM WORD
   ===================================================== */
document.getElementById('randomBtn').addEventListener('click', function(){
  var m = flatIndex[Math.floor(Math.random() * flatIndex.length)];
  trackNuance('tool_randomize', { experience_action: 'randomize' });
  navigateTo(m.ri, m.ci, m.si, m.wi, m.code);
});

/* =====================================================
   THEME
   ===================================================== */
var memTheme = null;
function readStoredTheme(){
  try{
    var v = window.localStorage.getItem('nuance-theme');
    return v;
  }catch(e){ return memTheme; }
}
function writeStoredTheme(v){
  memTheme = v;
  try{ window.localStorage.setItem('nuance-theme', v); }catch(e){ /* fall back to memory only */ }
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  /* Icon shows the theme you'll switch TO, not the one that's active:
     sun (switch to light) shows while dark is active, moon (switch to
     dark) shows while light is active. */
  document.getElementById('themeIconSun').style.display = (t==='dark') ? 'block' : 'none';
  document.getElementById('themeIconMoon').style.display = (t==='dark') ? 'none' : 'block';
}
(function initTheme(){
  var stored = readStoredTheme();
  var theme = stored ? stored : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
})();
document.getElementById('themeBtn').addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  var next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  writeStoredTheme(next);
});

   INIT
   ===================================================== */
document.getElementById('footStatus').textContent = totalWords() + ' words \u00b7 ' + DATA.length + ' roots';
renderAll();
goScreen('roots');

})();
