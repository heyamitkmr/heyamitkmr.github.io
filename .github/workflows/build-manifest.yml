name: Build library manifest

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'games/**'
      - 'scripts/generate_manifest.py'
      - '.github/workflows/build-manifest.yml'
  # Daily, to pick up changes on the "Bigger things" sites (they live elsewhere)
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST
  # "Run workflow" button on the Actions tab, for an update right away
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate projects_manifest.json
        run: python3 scripts/generate_manifest.py

      - name: Commit manifest if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate projects_manifest.json [skip ci]"
          file_pattern: projects_manifest.json
