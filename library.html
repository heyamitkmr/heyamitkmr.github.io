<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library — Tools & Games</title>
<meta name="description" content="Tools, games and bigger things made at NextFive. Fun or useful, and free to try.">
<meta name="skip-manifest" content="true">
<script>
  // Apply a saved theme choice before first paint (no flash).
  try { var t = localStorage.getItem('nf-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root{
    --bg:#f6edd8; --card:#fff9ea; --ink:#2b2a26; --ink2:#4e4b42; --ink3:#635f53;
    --line:#e0d2b2; --line2:#c9b88f; --accent:#0f6660; --accent-ink:#fff9ea; --accent-soft:#d8e6d6;
    --rust:#a93f22; --mustard:#dca32a; --tile:#fff9ea; --shadow:0 2px 0 var(--line);
    --sans:"Avenir Next",Avenir,"Century Gothic",Nunito,"Trebuchet MS","Noto Sans",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#1f2422; --card:#2a312d; --ink:#f6edd8; --ink2:#d8cfba; --ink3:#bab29e;
      --line:#3c453e; --line2:#566156; --accent:#5ccfc0; --accent-ink:#14201e; --accent-soft:#233a35;
      --rust:#f29a78; --tile:#f6edd8; --shadow:0 2px 0 #171b19; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1f2422; --card:#2a312d; --ink:#f6edd8; --ink2:#d8cfba; --ink3:#bab29e;
    --line:#3c453e; --line2:#566156; --accent:#5ccfc0; --accent-ink:#14201e; --accent-soft:#233a35;
    --rust:#f29a78; --tile:#f6edd8; --shadow:0 2px 0 #171b19; color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 16px 56px}

  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .brand{font-weight:700;color:var(--ink);text-decoration:none}
  .brand:hover{color:var(--accent)}
  .theme{width:42px;height:42px;border-radius:999px;border:1px solid var(--line2);background:var(--card);
    color:var(--ink);cursor:pointer;display:grid;place-items:center}
  .theme:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .theme svg{width:20px;height:20px}
  .moon{display:none}
  :root[data-theme="dark"] .sun{display:none} :root[data-theme="dark"] .moon{display:block}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .sun{display:none} :root:not([data-theme="light"]) .moon{display:block}
  }

  .hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:26px}
  .hero h1{font-size:clamp(2.2rem,6vw,3.3rem);line-height:1.05;color:var(--accent);font-weight:800;letter-spacing:-.5px}
  .hero p{color:var(--ink2);max-width:34rem;margin-top:12px}
  .hero p a{color:var(--accent)}
  .art{width:180px;height:auto}
  @media (max-width:600px){.art{display:none}.hero{grid-template-columns:1fr}}

  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:8px}
  .search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);
    border-radius:999px;padding:0 16px;min-height:46px;color:var(--ink3)}
  .search svg{width:18px;height:18px;flex:none}
  .search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;outline:none;min-width:0}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line2);background:transparent;color:var(--ink2);border-radius:999px;padding:7px 14px;
    font:600 .85rem var(--sans);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .sec{font-size:.78rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3);font-weight:700;
    margin:30px 0 12px;display:flex;align-items:center;gap:12px}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .grid-big{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}

  .card{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow);color:var(--ink);text-decoration:none;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .tile{flex:none;width:46px;height:46px;border-radius:12px;background:var(--tile);border:1px solid var(--line);
    display:grid;place-items:center;font-size:1.5rem;line-height:1}
  .tile img{width:32px;height:32px;display:block}
  .body{display:flex;flex-direction:column;gap:3px;min-width:0}
  .title{font-weight:700;line-height:1.3}
  .desc{font-size:.88rem;color:var(--ink2);line-height:1.45}
  .card.big{flex-direction:column;padding:20px;border-radius:20px;background:linear-gradient(160deg,var(--accent-soft),var(--card) 55%)}
  .card.big .tile{width:58px;height:58px;border-radius:16px}
  .card.big .tile img{width:40px;height:40px}
  .card.big .title{font-size:1.2rem}
  .go{margin-top:auto;font-size:.88rem;font-weight:700;color:var(--accent)}

  .none{color:var(--ink3);padding:20px 0}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">NextFive</a>
    <button class="theme" type="button" aria-label="Switch between light and dark theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
  </header>

  <div class="hero">
    <div>
      <h1>Library</h1>
      <p>Some tools and games you may find fun or useful. <a href="https://blog.nextfive.in/products/">Further context on what / why / how</a> for some of these.</p>
    </div>
    <!-- three app cards, fanned out like a hand of cards -->
    <svg class="art" viewBox="0 0 180 100" fill="none" aria-hidden="true">
      <g transform="rotate(-14 70 92)"><rect x="40" y="22" width="46" height="62" rx="9" fill="var(--accent)"/>
        <path d="M52 52l7 7 13-14" stroke="var(--card)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g><rect x="67" y="16" width="46" height="62" rx="9" fill="#dca32a"/>
        <circle cx="90" cy="47" r="11" stroke="var(--card)" stroke-width="4"/></g>
      <g transform="rotate(14 110 92)"><rect x="94" y="22" width="46" height="62" rx="9" fill="var(--rust)"/>
        <path d="M117 38l11 20h-22z" stroke="var(--card)" stroke-width="4" stroke-linejoin="round"/></g>
      <rect x="20" y="88" width="140" height="5" rx="2.5" fill="var(--line2)"/>
      <g stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"><path d="M160 13V31M151 22H169M153.7 15.7L166.3 28.3M153.7 28.3L166.3 15.7"/></g>
      <circle cx="160" cy="22" r="2.6" fill="var(--accent)"/>
      <circle cx="24" cy="30" r="3.2" fill="var(--rust)"/>
    </svg>
  </div>

  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="search" type="search" placeholder="Search by name or description" aria-label="Search the library">
    </label>
    <div class="chips" id="chips"></div>
  </div>

  <div id="output"></div>
  <p id="none" class="none" hidden>Nothing matches that. Try another word.</p>
</div>

<script>
// Sections, in page order. Anything else in the manifest is shown after these.
const CATEGORIES = [
  { key: "bigger", label: "Bigger things", big: true },
  { key: "tools",  label: "Tools" },
  { key: "games",  label: "Games" },
];

let ALL = [];
let filter = "all";

// Theme toggle: follows the device until the visitor picks; the pick is remembered.
(function () {
  const root = document.documentElement;
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark"
                                          : matchMedia("(prefers-color-scheme: dark)").matches;
  document.querySelector(".theme").addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("nf-theme", next); } catch (e) {}
  });
})();

fetch('/projects_manifest.json')
  .then(r => { if (!r.ok) throw new Error('manifest missing'); return r.json(); })
  .then(entries => { ALL = entries; drawChips(); draw(); })
  .catch(() => {
    document.getElementById('output').innerHTML =
      '<p class="none">Couldn\'t load projects_manifest.json yet — it\'s generated automatically on the next push to main.</p>';
  });

function categories() {
  const known = CATEGORIES.filter(c => ALL.some(e => e.category === c.key));
  const extra = [...new Set(ALL.map(e => e.category))]
    .filter(k => !CATEGORIES.some(c => c.key === k)).sort()
    .map(k => ({ key: k, label: k.charAt(0).toUpperCase() + k.slice(1) }));
  return known.concat(extra);
}

function drawChips() {
  const chips = [{ key: "all", label: "All" }].concat(categories());
  const box = document.getElementById('chips');
  box.innerHTML = chips.map(c =>
    `<button type="button" class="chip" data-filter="${escapeHtml(c.key)}" aria-pressed="${c.key === filter}">${escapeHtml(c.label)}</button>`
  ).join('');
  box.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
    filter = btn.dataset.filter;
    box.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b === btn));
    draw();
  }));
}

function draw() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const matches = e => (filter === "all" || e.category === filter) &&
    (e.title.toLowerCase().includes(q) || (e.description || '').toLowerCase().includes(q));

  const html = categories().map(c => {
    const items = ALL.filter(e => e.category === c.key && matches(e));
    if (!items.length) return '';
    return `<section>
      <h2 class="sec">${escapeHtml(c.label)}</h2>
      <div class="grid${c.big ? ' grid-big' : ''}">${items.map(e => cardHtml(e, c.big)).join('')}</div>
    </section>`;
  }).join('');

  document.getElementById('output').innerHTML = html;
  document.getElementById('none').hidden = !!html;
}

function cardHtml(e, big) {
  const icon = e.icon
    ? `<img src="${escapeHtml(e.icon)}" alt="" loading="lazy">`
    : `<span aria-hidden="true">${escapeHtml(e.emoji || '•')}</span>`;
  return `<a class="card${big ? ' big' : ''}" href="${escapeHtml(e.url)}">
    <span class="tile">${icon}</span>
    <span class="body">
      <span class="title">${escapeHtml(e.title)}</span>
      <span class="desc">${escapeHtml(e.description || '')}</span>
    </span>
    ${big ? '<span class="go">Open <span aria-hidden="true">→</span></span>' : ''}
  </a>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('search').addEventListener('input', draw);
</script>
</body>
</html>
